<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大戰局：歷史反攻地圖 - 靜態半螢幕版</title>
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- PeerJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>

    <style>
        :root {
            --bg-dark: #070a0e;
            --panel-bg: rgba(13, 19, 28, 0.92);
            --panel-border: rgba(56, 189, 248, 0.25);
            --kmt-color: #38bdf8;
            --kmt-glow: rgba(56, 189, 248, 0.4);
            --cpc-color: #f43f5e;
            --cpc-glow: rgba(244, 63, 94, 0.4);
            --gold-accent: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.5);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 70%),
                linear-gradient(0deg, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
        }

        .scanline {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px; z-index: 999; pointer-events: none; opacity: 0.5;
        }

        header {
            width: 100%; max-width: 1100px; padding: 8px 15px 4px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .title-group h1 {
            font-size: 1.2rem; letter-spacing: 1px; color: var(--text-main);
            display: flex; align-items: center; gap: 8px;
            text-shadow: 0 0 10px var(--kmt-glow);
        }
        .title-group h1 span { color: var(--gold-accent); }
        .subtitle { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }

        .main-container {
            display: flex; flex-direction: column; gap: 8px;
            width: 100%; max-width: 1100px; padding: 6px;
        }

        /* 抬頭指揮 HUD */
        .hud-bar {
            background: var(--panel-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border); border-radius: 8px;
            padding: 6px 12px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); flex-wrap: wrap; gap: 8px;
        }

        .hud-status { display: flex; align-items: center; gap: 12px; }
        .turn-badge {
            font-size: 0.8rem; font-weight: bold; padding: 4px 8px; border-radius: 4px;
            display: flex; align-items: center; gap: 6px;
        }
        .badge-kmt { background: rgba(56, 189, 248, 0.15); border: 1px solid var(--kmt-color); color: var(--kmt-color); }
        .badge-cpc { background: rgba(244, 63, 94, 0.15); border: 1px solid var(--cpc-color); color: var(--cpc-color); }

        .ap-tracker { display: flex; align-items: center; gap: 6px; }
        .ap-title { font-size: 0.75rem; color: var(--text-muted); font-weight: bold; }
        .ap-dots { display: flex; gap: 4px; }
        .ap-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #1e293b; border: 1px solid #475569; transition: all 0.3s;
        }
        .ap-dot.active { background: var(--gold-accent); border-color: #fff; box-shadow: 0 0 6px var(--gold-glow); }

        .end-turn-btn {
            background: linear-gradient(135deg, #d97706, #b45309);
            color: #fff; border: none; padding: 5px 12px; border-radius: 6px;
            font-weight: bold; font-size: 0.75rem; cursor: pointer;
            box-shadow: 0 0 10px rgba(217, 119, 6, 0.4); display: flex; align-items: center; gap: 6px;
        }
        .end-turn-btn:disabled { background: #334155; color: #64748b; box-shadow: none; }

        /* 地圖區域：精準設定為螢幕高度的一半 (50vh)，並鎖定游標 */
        #map-container { 
            position: relative; width: 100%; border-radius: 8px; 
            overflow: hidden; border: 1px solid var(--panel-border); 
        }
        #map { 
            height: 50vh; 
            max-height: 50vh;
            width: 100%; 
            background: #000; 
            z-index: 1; 
            cursor: default !important; /* 提示玩家無法拖曳 */
        }

        .tactical-marker {
            width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #fff; font-size: 11px;
            border: 2px solid #fff; transition: all 0.3s; cursor: pointer;
        }
        .marker-kmt { background: var(--kmt-color); box-shadow: 0 0 12px var(--kmt-color); }
        .marker-cpc { background: var(--cpc-color); box-shadow: 0 0 12px var(--cpc-color); }
        .marker-selected { transform: scale(1.25); border-color: var(--gold-accent) !important; box-shadow: 0 0 18px var(--gold-accent) !important; }

        /* 操作與日誌面板 */
        .bottom-grid {
            display: grid; grid-template-columns: 320px 1fr; gap: 8px;
        }

        .control-card {
            background: var(--panel-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border); border-radius: 8px; padding: 8px;
            display: flex; flex-direction: column; gap: 6px;
        }

        .card-header {
            font-size: 0.8rem; font-weight: bold; color: var(--gold-accent);
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px;
        }

        .mode-selector { display: flex; gap: 4px; }
        .mode-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--panel-border);
            color: var(--text-muted); padding: 3px 6px; border-radius: 4px;
            cursor: pointer; font-size: 0.7rem; transition: all 0.2s;
        }
        .mode-btn.active { background: var(--gold-accent); color: #000; font-weight: bold; }

        /* 戰術動作按鈕 */
        .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .action-card-btn {
            background: rgba(30, 41, 59, 0.8); border: 1px solid var(--panel-border);
            border-radius: 6px; padding: 6px 8px; color: var(--text-main); cursor: pointer;
            display: flex; flex-direction: column; gap: 2px; text-align: left;
        }
        .action-card-btn:disabled { opacity: 0.35; cursor: not-allowed; border-color: transparent; }
        .action-card-btn .btn-title { font-weight: bold; font-size: 0.78rem; display: flex; justify-content: space-between; }
        .action-card-btn .btn-cost { font-size: 0.65rem; color: var(--gold-accent); }
        .action-card-btn .btn-desc { font-size: 0.65rem; color: var(--text-muted); }

        #log-window {
            height: 95px; background: rgba(5, 8, 12, 0.95);
            border: 1px solid var(--panel-border); color: #38edf8;
            font-family: monospace; padding: 6px; overflow-y: auto;
            border-radius: 4px; font-size: 0.72rem; line-height: 1.35;
            -webkit-overflow-scrolling: touch;
        }

        .floating-num {
            position: absolute; font-size: 1.3rem; font-weight: 900; pointer-events: none;
            animation: floatUp 0.8s ease-out forwards; text-shadow: 0 0 6px rgba(0,0,0,0.9); z-index: 1000;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
            100% { opacity: 0; transform: translate(-50%, -40px) scale(1); }
        }

        /* 手機 RWD 排版 */
        @media (max-width: 768px) {
            .bottom-grid { grid-template-columns: 1fr; }
            header { flex-direction: column; gap: 4px; text-align: center; }
            .hud-bar { justify-content: space-around; }
        }
    </style>
</head>
<body>

    <div class="scanline"></div>

    <header>
        <div class="title-group">
            <h1><i class="fa-solid fa-satellite-dish"></i> 大戰局：<span>反攻戰術地圖</span></h1>
            <div class="subtitle">完全靜態鎖定 / 50% 畫面視角</div>
        </div>
        <div class="mode-selector">
            <button class="mode-btn active" id="btn-mode-ai" onclick="switchGameMode('AI')"><i class="fa-solid fa-robot"></i> AI 單人</button>
            <button class="mode-btn" id="btn-mode-p2p" onclick="switchGameMode('P2P')"><i class="fa-solid fa-network-wired"></i> P2P 雙人</button>
        </div>
    </header>

    <div class="main-container">
        <!-- 戰術抬頭面板 -->
        <div class="hud-bar">
            <div class="hud-status">
                <div id="turn-badge" class="turn-badge badge-kmt">
                    <i class="fa-solid fa-shield-halved"></i> 國軍階段
                </div>
                <div class="ap-tracker">
                    <span class="ap-title">AP</span>
                    <div class="ap-dots" id="ap-dots">
                        <div class="ap-dot active"></div>
                        <div class="ap-dot active"></div>
                        <div class="ap-dot active"></div>
                    </div>
                </div>
            </div>
            <div style="display:flex; gap:6px;">
                <button class="end-turn-btn" id="btn-end-turn" onclick="endTurn()"><i class="fa-solid fa-forward"></i> 結束回合</button>
                <button class="mode-btn" style="background:#b91c1c; color:#fff;" onclick="resetGame(true)"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
        </div>

        <!-- 50% 高度 + 禁滑動放大縮小地圖 -->
        <div id="map-container">
            <div id="map"></div>
        </div>

        <div class="bottom-grid">
            <!-- 戰術控制指令卡 -->
            <div class="control-card">
                <div class="card-header">
                    <span><i class="fa-solid fa-crosshairs"></i> 目標：<b id="target-region-name" style="color:#fff;">請點選地圖區域</b></span>
                    <span id="target-region-hp" style="color:var(--text-muted);">HP: --/--</span>
                </div>
                
                <div class="actions-grid">
                    <button class="action-card-btn" id="act-attack" onclick="executeTacticalAction('ATTACK')" disabled>
                        <div class="btn-title"><span><i class="fa-solid fa-burst"></i> 強襲</span><span class="btn-cost">2 AP</span></div>
                        <div class="btn-desc">造成 25-45 點傷害</div>
                    </button>

                    <button class="action-card-btn" id="act-raid" onclick="executeTacticalAction('RAID')" disabled>
                        <div class="btn-title"><span><i class="fa-solid fa-skull"></i> 奇襲</span><span class="btn-cost">1 AP</span></div>
                        <div class="btn-desc">15 傷害 (35% 機率暴擊 50)</div>
                    </button>

                    <button class="action-card-btn" id="act-fortify" onclick="executeTacticalAction('FORTIFY')" disabled>
                        <div class="btn-title"><span><i class="fa-solid fa-shield"></i> 加固</span><span class="btn-cost">1 AP</span></div>
                        <div class="btn-desc">修復駐軍防線 +25 HP</div>
                    </button>

                    <button class="action-card-btn" id="act-conscript" onclick="executeTacticalAction('CONSCRIPT')" disabled>
                        <div class="btn-title"><span><i class="fa-solid fa-user-plus"></i> 徵兵</span><span class="btn-cost">2 AP</span></div>
                        <div class="btn-desc">提升區域上限 (+20)</div>
                    </button>
                </div>

                <div id="p2p-panel" style="display: none; flex-direction: column; gap:4px; border-top:1px solid rgba(255,255,255,0.1); padding-top:6px;">
                    <div style="font-size:0.7rem; color:var(--gold-accent);">
                        自訂房間 ID：
                        <input type="text" id="room-id" maxlength="32"
                            placeholder="例如 MyRoom123"
                            style="background:#000; border:1px solid var(--panel-border); color:#fff; padding:4px; font-size:0.75rem; border-radius:4px; width:150px;">
                        <button class="mode-btn" style="background:var(--gold-accent); color:#000; font-weight:bold;" onclick="createRoom()">建立房間</button>
                    </div>
                    <div style="display:flex; gap:4px;">
                        <input type="text" id="join-id" maxlength="32"
                            placeholder="輸入對手房間 ID"
                            style="background:#000; border:1px solid var(--panel-border); color:#fff; padding:4px; font-size:0.75rem; border-radius:4px; flex:1;">
                        <button class="mode-btn" style="background:var(--gold-accent); color:#000; font-weight:bold;" onclick="connectToPeer()">加入房間</button>
                    </div>
                    <div style="font-size:0.65rem; color:var(--text-muted);">
                        <span id="my-id">尚未建立房間</span>
                    </div>
                </div>
            </div>

            <!-- 戰況日誌 -->
            <div class="control-card">
                <div class="card-header">
                    <span><i class="fa-solid fa-terminal"></i> 戰術動態 Log</span>
                    <span style="font-size: 0.7rem; color: var(--text-muted);" id="round-indicator">ROUND 1</span>
                </div>
                <div id="log-window"></div>
            </div>
        </div>
    </div>

    <script>
        const initialRegions = [
            { id: 'northeast', name: '東北 (瀋陽)', owner: 'CPC', hp: 100, maxHp: 100, lat: 41.83, lng: 123.43 },
            { id: 'north', name: '華北 (北京)', owner: 'CPC', hp: 100, maxHp: 100, lat: 39.90, lng: 116.40 },
            { id: 'east', name: '華東 (南京)', owner: 'CPC', hp: 100, maxHp: 100, lat: 32.06, lng: 118.79 },
            { id: 'south', name: '華南 (廣州)', owner: 'CPC', hp: 100, maxHp: 100, lat: 23.12, lng: 113.26 },
            { id: 'southwest', name: '大西南 (成都)', owner: 'CPC', hp: 100, maxHp: 100, lat: 30.57, lng: 104.06 },
            { id: 'taiwan', name: '台灣 (台北基地)', owner: 'KMT', hp: 100, maxHp: 100, lat: 25.03, lng: 121.56 }
        ];

        let map, markers = {}, polylineGroup = null;
        let gameMode = 'AI';
        const MAX_AP = 3;
        let gameState = { turn: 'KMT', ap: MAX_AP, round: 1, regions: JSON.parse(JSON.stringify(initialRegions)) };
        let selectedRegionId = null;
        let myRole = 'KMT';
        let peer = null, conn = null, isAiThinking = false, gameOver = false, pendingPeerId = null;

        function initMap() {
            // 初始化靜態鎖定地圖 (絕對禁止移動與縮放)
            map = L.map('map', {
                center: [30.0, 112.0],        // 最佳中央座標 (包含全中國與台灣)
                zoom: 4,                      // 固定縮放等級
                zoomControl: false,           // 移除 +/- 縮放按鈕
                dragging: false,              // 關閉滑鼠/觸控拖曳
                touchZoom: false,             // 關閉雙指縮放
                scrollWheelZoom: false,       // 關閉滾輪縮放
                doubleClickZoom: false,       // 關閉雙擊縮放
                boxZoom: false,               // 關閉拉框縮放
                keyboard: false               // 關閉方向鍵微調
            });

            // CartoDB 暗黑地圖
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap', subdomains: 'abcd'
            }).addTo(map);

            window.addEventListener('resize', () => map.invalidateSize());

            polylineGroup = L.layerGroup().addTo(map);
            renderMapElements();
        }

        function selectRegion(id) {
            selectedRegionId = id;
            renderMapElements();
            updateActionButtonStates();
        }

        function renderMapElements() {
            polylineGroup.clearLayers();
            const taiwanRegion = gameState.regions.find(r => r.id === 'taiwan');

            gameState.regions.forEach(region => {
                const isKmt = region.owner === 'KMT';
                const isSelected = region.id === selectedRegionId;

                if (!markers[region.id]) {
                    const customIcon = L.divIcon({
                        className: 'custom-map-icon',
                        html: `<div id="icon-${region.id}" class="tactical-marker ${isKmt ? 'marker-kmt' : 'marker-cpc'} ${isSelected ? 'marker-selected' : ''}">
                                <i class="fa-solid ${isKmt ? 'fa-shield-halved' : 'fa-flag'}"></i>
                               </div>`,
                        iconSize: [30, 30], iconAnchor: [15, 15]
                    });

                    const marker = L.marker([region.lat, region.lng], { icon: customIcon }).addTo(map);
                    marker.on('click', () => selectRegion(region.id));
                    markers[region.id] = marker;
                } else {
                    const iconEl = document.getElementById(`icon-${region.id}`);
                    if (iconEl) {
                        iconEl.className = `tactical-marker ${isKmt ? 'marker-kmt' : 'marker-cpc'} ${isSelected ? 'marker-selected' : ''}`;
                    }
                }

                if (region.id !== 'taiwan' && taiwanRegion) {
                    const line = L.polyline([[taiwanRegion.lat, taiwanRegion.lng], [region.lat, region.lng]], {
                        color: isKmt ? '#38bdf8' : '#f43f5e', weight: isSelected ? 2.5 : 1, opacity: 0.5, dashArray: '4, 6'
                    });
                    polylineGroup.addLayer(line);
                }
            });

            updateHUD();
        }

        function updateHUD() {
            const isMyTurn = gameState.turn === myRole;
            const badge = document.getElementById('turn-badge');
            const endBtn = document.getElementById('btn-end-turn');

            if (gameState.turn === 'KMT') {
                badge.className = "turn-badge badge-kmt";
                badge.innerHTML = `<i class="fa-solid fa-shield-halved"></i> 國軍階段 ${isMyTurn ? '(你)' : ''}`;
            } else {
                badge.className = "turn-badge badge-cpc";
                badge.innerHTML = `<i class="fa-solid fa-flag"></i> 共軍階段 ${gameMode === 'AI' ? '(電腦)' : (isMyTurn ? '(你)' : '')}`;
            }

            endBtn.disabled = !isMyTurn || isAiThinking || gameOver;

            const apContainer = document.getElementById('ap-dots');
            apContainer.innerHTML = '';
            for (let i = 0; i < MAX_AP; i++) {
                const dot = document.createElement('div');
                dot.className = `ap-dot ${i < gameState.ap ? 'active' : ''}`;
                apContainer.appendChild(dot);
            }

            document.getElementById('round-indicator').innerText = `ROUND ${gameState.round}`;

            const targetName = document.getElementById('target-region-name');
            const targetHp = document.getElementById('target-region-hp');

            if (selectedRegionId) {
                const region = gameState.regions.find(r => r.id === selectedRegionId);
                targetName.innerText = `${region.name}`;
                targetHp.innerText = `HP: ${Math.max(0, region.hp)}/${region.maxHp}`;
            } else {
                targetName.innerText = "請選擇區域";
                targetHp.innerText = "HP: --/--";
            }
        }

        function updateActionButtonStates() {
            const isMyTurn = gameState.turn === myRole && !isAiThinking && !gameOver;
            const region = gameState.regions.find(r => r.id === selectedRegionId);

            const btnAttack = document.getElementById('act-attack');
            const btnRaid = document.getElementById('act-raid');
            const btnFortify = document.getElementById('act-fortify');
            const btnConscript = document.getElementById('act-conscript');

            if (!region || !isMyTurn) {
                [btnAttack, btnRaid, btnFortify, btnConscript].forEach(btn => btn.disabled = true);
                return;
            }

            const isEnemy = region.owner !== myRole;
            btnAttack.disabled = !isEnemy || gameState.ap < 2;
            btnRaid.disabled = !isEnemy || gameState.ap < 1;
            btnFortify.disabled = isEnemy || gameState.ap < 1;
            btnConscript.disabled = isEnemy || gameState.ap < 2;
        }

        function executeTacticalAction(type) {
            if (gameOver || gameState.turn !== myRole || isAiThinking || !selectedRegionId) return;

            const region = gameState.regions.find(r => r.id === selectedRegionId);
            if (!region) return;

            const costs = { ATTACK: 2, RAID: 1, FORTIFY: 1, CONSCRIPT: 2 };
            const apCostCheck = costs[type];
            if (!apCostCheck || gameState.ap < apCostCheck) return;

            const isEnemy = region.owner !== myRole;
            if ((type === 'ATTACK' || type === 'RAID') && !isEnemy) return;
            if ((type === 'FORTIFY' || type === 'CONSCRIPT') && isEnemy) return;

            let logMsg = ``, animText = "", animColor = "#f43f5e", apCost = 0;

            if (type === 'ATTACK') {
                apCost = 2;
                const damage = Math.floor(Math.random() * 21) + 25;
                region.hp -= damage;
                animText = `-${damage}`;
                logMsg = `${myRole === 'KMT' ? '國軍' : '共軍'} 強襲 [${region.name}] -${damage} HP`;
            } else if (type === 'RAID') {
                apCost = 1;
                const isCrit = Math.random() < 0.35;
                const damage = isCrit ? 50 : 15;
                region.hp -= damage;
                animText = isCrit ? `暴擊 -${damage}` : `奇襲 -${damage}`;
                animColor = "#a855f7";
                logMsg = `${myRole === 'KMT' ? '國軍' : '共軍'} 奇襲 [${region.name}] ${isCrit ? '(暴擊!)' : ''} -${damage} HP`;
            } else if (type === 'FORTIFY') {
                apCost = 1;
                region.hp = Math.min(region.maxHp, region.hp + 25);
                animText = `+25`; animColor = "#22c55e";
                logMsg = `${myRole === 'KMT' ? '國軍' : '共軍'} 加固 [${region.name}] +25 HP`;
            } else if (type === 'CONSCRIPT') {
                apCost = 2;
                region.maxHp += 20; region.hp += 20;
                animText = `上限+20`; animColor = "#38bdf8";
                logMsg = `${myRole === 'KMT' ? '國軍' : '共軍'} [${region.name}] 徵兵，上限提升`;
            }

            gameState.ap -= apCost;

            if (region.hp <= 0) {
                region.hp = 50;
                region.owner = myRole;
                logMsg += ` (成功佔領該區域！)`;
            }

            showMapFloatingNum(region.lat, region.lng, animText, animColor);
            log(logMsg);

            renderMapElements();
            updateActionButtonStates();

            if (gameMode === 'P2P') {
                sendData({
                    type: 'ACTION',
                    gameState: gameState,
                    msg: logMsg,
                    anim: { lat: region.lat, lng: region.lng, text: animText, color: animColor }
                });
            }

            checkWin();
        }

        function endTurn() {
            if (gameOver || gameState.turn !== myRole || isAiThinking) return;

            gameState.turn = gameState.turn === 'KMT' ? 'CPC' : 'KMT';
            gameState.ap = MAX_AP;
            gameState.round += 1;

            log(`--- 切換至 [${gameState.turn === 'KMT' ? '國軍' : '共軍'}] 行動階段 ---`);

            renderMapElements();
            updateActionButtonStates();

            if (gameMode === 'P2P') {
                sendData({ type: 'END_TURN', gameState: gameState, msg: `對手已結束回合` });
            }

            if (gameMode === 'AI' && gameState.turn === 'CPC') {
                aiTurnEngine();
            }
        }

        function aiTurnEngine() {
            if (gameOver) return;
            isAiThinking = true;
            updateHUD();
            updateActionButtonStates();

            let aiAp = MAX_AP;

            const aiInterval = setInterval(() => {
                const kmtRegions = gameState.regions.filter(r => r.owner === 'KMT');
                const cpcRegions = gameState.regions.filter(r => r.owner === 'CPC');

                if (aiAp >= 2 && kmtRegions.length > 0) {
                    kmtRegions.sort((a, b) => a.hp - b.hp);
                    const target = kmtRegions[0];
                    const dmg = 30;
                    target.hp -= dmg;
                    aiAp -= 2;

                    showMapFloatingNum(target.lat, target.lng, `-${dmg}`, "#f43f5e");
                    let msg = `電腦 AI 強襲攻打 [${target.name}] (-${dmg})`;
                    if (target.hp <= 0) { target.hp = 50; target.owner = 'CPC'; msg += ` (已被佔領)`; }
                    log(msg);
                } else if (aiAp >= 1 && cpcRegions.length > 0) {
                    cpcRegions.sort((a, b) => a.hp - b.hp);
                    const target = cpcRegions[0];
                    target.hp = Math.min(target.maxHp, target.hp + 25);
                    aiAp -= 1;

                    showMapFloatingNum(target.lat, target.lng, `+25`, "#22c55e");
                    log(`電腦 AI 加固 [${target.name}] 防線`);
                } else {
                    aiAp = 0;
                }

                renderMapElements();

                if (aiAp <= 0 || checkWin()) {
                    clearInterval(aiInterval);
                    gameState.turn = 'KMT';
                    gameState.ap = MAX_AP;
                    gameState.round += 1;
                    isAiThinking = false;
                    log(`--- 電腦 AI 結束回合，輪至你的階段 ---`);
                    renderMapElements();
                    updateActionButtonStates();
                }
            }, 800);
        }

        function showMapFloatingNum(lat, lng, text, color) {
            const point = map.latLngToContainerPoint([lat, lng]);
            const num = document.createElement('div');
            num.className = 'floating-num';
            num.innerText = text;
            num.style.color = color;
            num.style.left = `${point.x}px`;
            num.style.top = `${point.y}px`;
            document.getElementById('map-container').appendChild(num);
            setTimeout(() => num.remove(), 800);
        }

        function checkWin() {
            const kmtCount = gameState.regions.filter(r => r.owner === 'KMT').length;
            const cpcCount = gameState.regions.filter(r => r.owner === 'CPC').length;

            if (cpcCount === 0) {
                gameOver = true;
                isAiThinking = false;
                alert("【勝利】光復所有重鎮，戰局結束！");
                updateHUD();
                updateActionButtonStates();
                return true;
            }
            if (kmtCount === 0) {
                gameOver = true;
                isAiThinking = false;
                alert("【敗北】防線被攻破，戰局結束！");
                updateHUD();
                updateActionButtonStates();
                return true;
            }
            return false;
        }

        function initPeer(customId = null) {
            if (peer) return;

            const peerOptions = {
                config: {
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                }
            };

            if (customId) peerOptions.host = undefined;

            peer = customId
                ? new Peer(customId, peerOptions)
                : new Peer(peerOptions);

            peer.on('open', (id) => {
                document.getElementById('my-id').innerText = `房間：${id}`;
                log(`P2P 房間已建立：${id}`);

                // 使用者在 Peer 尚未 open 時按下連線，延後到 open 後再連。
                if (pendingPeerId) {
                    const targetId = pendingPeerId;
                    pendingPeerId = null;
                    connectToPeerId(targetId);
                }
            });

            peer.on('connection', (c) => {
                // 同一時間只維持一條連線。
                if (conn && conn.open) conn.close();

                conn = c;
                myRole = 'KMT';
                log(`對手已加入！你扮演 國軍`);
                setupConnection(conn, true);
            });

            peer.on('error', (err) => {
                log(`P2P 錯誤：${err.type || err.message || '未知錯誤'}`);
            });
        }

        function createRoom() {
            const roomId = document.getElementById('room-id').value.trim();

            if (!roomId) {
                return alert("請輸入自訂房間 ID！");
            }

            if (!/^[A-Za-z0-9_-]+$/.test(roomId)) {
                return alert("房間 ID 只能使用英文字母、數字、底線 _ 或減號 -");
            }

            if (peer) {
                if (peer.open) {
                    document.getElementById('my-id').innerText = `房間：${peer.id}`;
                    log(`目前房間：${peer.id}`);
                    return;
                }
                peer.destroy();
                peer = null;
            }

            myRole = 'KMT';
            log(`正在建立房間：${roomId} ...`);

            initPeer(roomId);
        }

        function connectToPeer() {
            const targetId = document.getElementById('join-id').value.trim();
            if (!targetId) return alert("請輸入要加入的房間 ID！");

            // 加入別人的房間時，本機使用 PeerJS 自動產生的 ID。
            if (!peer) initPeer();

            if (!peer.open) {
                pendingPeerId = targetId;
                log(`等待 P2P 初始化後加入房間...`);
                return;
            }

            connectToPeerId(targetId);
        }

        function connectToPeerId(targetId) {
            if (!peer) return;

            if (conn && conn.open) conn.close();

            conn = peer.connect(targetId);
            myRole = 'CPC';
            log(`正在連線房主...`);
            setupConnection(conn, false);
        }

        function setupConnection(connection, isHost) {
            if (!connection) return;

            connection.on('open', () => {
                log(`P2P 通道建立成功！`);

                // 修正原本 INIT 在 connection 尚未 open 時送出而遺失的問題。
                if (isHost) {
                    sendData({ type: 'INIT', gameState: gameState });
                }

                renderMapElements();
                updateActionButtonStates();
            });

            connection.on('data', (data) => {
                if (!data || typeof data !== 'object' || !data.type) return;

                if (data.type === 'INIT') {
                    if (!data.gameState || !Array.isArray(data.gameState.regions)) return;
                    gameState = data.gameState;
                    gameOver = false;
                    log(`已同步戰局資料，你扮演 共軍`);
                } else if (data.type === 'ACTION' || data.type === 'END_TURN') {
                    if (!data.gameState || !Array.isArray(data.gameState.regions)) return;
                    gameState = data.gameState;

                    if (data.anim &&
                        Number.isFinite(data.anim.lat) &&
                        Number.isFinite(data.anim.lng)) {
                        showMapFloatingNum(
                            data.anim.lat,
                            data.anim.lng,
                            String(data.anim.text || ''),
                            String(data.anim.color || '#fff')
                        );
                    }

                    if (typeof data.msg === 'string') log(data.msg);
                } else if (data.type === 'RESET') {
                    alert("對手重置了戰局！");
                    resetGameData();
                }

                renderMapElements();
                updateActionButtonStates();
                checkWin();
            });

            connection.on('close', () => {
                log(`P2P 連線已關閉。`);
            });

            connection.on('error', (err) => {
                log(`連線錯誤：${err.message || '未知錯誤'}`);
            });
        }

        function sendData(data) {
            if (conn && conn.open) conn.send(data);
        }

        function switchGameMode(mode) {
            if (mode === gameMode) return;

            if (mode === 'AI') {
                if (conn && conn.open) conn.close();
                conn = null;
                pendingPeerId = null;
                gameMode = 'AI';
                myRole = 'KMT';
            } else {
                gameMode = 'P2P';
                myRole = 'KMT';
            }

            document.getElementById('btn-mode-ai').classList.toggle('active', mode === 'AI');
            document.getElementById('btn-mode-p2p').classList.toggle('active', mode === 'P2P');
            document.getElementById('p2p-panel').style.display = mode === 'P2P' ? 'flex' : 'none';

            resetGame(false);
        }

        function resetGame(notify = true) {
            if (gameMode === 'P2P' && notify && conn && conn.open) sendData({ type: 'RESET' });
            resetGameData();
        }

        function resetGameData() {
            isAiThinking = false;
            gameOver = false;
            gameState = { turn: 'KMT', ap: MAX_AP, round: 1, regions: JSON.parse(JSON.stringify(initialRegions)) };
            selectedRegionId = null;
            renderMapElements();
            updateActionButtonStates();
            log(`戰局已恢復初始狀態`);
        }

        function log(msg) {
            const win = document.getElementById('log-window');
            const row = document.createElement('div');
            row.textContent = `> ${String(msg)}`;
            win.appendChild(row);
            win.scrollTop = win.scrollHeight;
        }

        window.onload = () => { initMap(); };
    </script>
