<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大戰局：歷史反攻地圖 - P2V-V2 修正版</title>
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- PeerJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>

    <style>
        :root {
            --bg-dark: #070a0e;
            --panel-bg: rgba(13, 19, 28, 0.92);
            --panel-border: rgba(56, 189, 248, 0.25);
            --kmt-color: #38bdf8;
            --kmt-glow: rgba(56, 189, 248, 0.4);
            --cpc-color: #f43f5e;
            --cpc-glow: rgba(244, 63, 94, 0.4);
            --gold-accent: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.5);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 70%),
                linear-gradient(0deg, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
        }

        .scanline {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px; z-index: 999; pointer-events: none; opacity: 0.5;
        }

        header {
            width: 100%; max-width: 1100px; padding: 8px 15px 4px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .title-group h1 {
            font-size: 1.2rem; letter-spacing: 1px; color: var(--text-main);
            display: flex; align-items: center; gap: 8px;
            text-shadow: 0 0 10px var(--kmt-glow);
        }
        .title-group h1 span { color: var(--gold-accent); }
        .subtitle { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }

        .main-container {
            display: flex; flex-direction: column; gap: 8px;
            width: 100%; max-width: 1100px; padding: 6px;
        }

        /* 抬頭指揮 HUD */
        .hud-bar {
            background: var(--panel-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border); border-radius: 8px;
            padding: 6px 12px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); flex-wrap: wrap; gap: 8px;
        }

        .hud-status { display: flex; align-items: center; gap: 12px; }
        .turn-badge {
            font-size: 0.8rem; font-weight: bold; padding: 4px 8px; border-radius: 4px;
            display: flex; align-items: center; gap: 6px;
        }
        .badge-kmt { background: rgba(56, 189, 248, 0.15); border: 1px solid var(--kmt-color); color: var(--kmt-color); }
        .badge-cpc { background: rgba(244, 63, 94, 0.15); border: 1px solid var(--cpc-color); color: var(--cpc-color); }

        .ap-tracker { display: flex; align-items: center; gap: 6px; }
        .ap-title { font-size: 0.75rem; color: var(--text-muted); font-weight: bold; }
        .ap-dots { display: flex; gap: 4px; }
        .ap-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #1e293b; border: 1px solid #475569; transition: all 0.3s;
        }
        .ap-dot.active { background: var(--gold-accent); border-color: #fff; box-shadow: 0 0 6px var(--gold-glow); }

        .end-turn-btn {
            background: linear-gradient(135deg, #d97706, #b45309);
            color: #fff; border: none; padding: 5px 12px; border-radius: 6px;
            font-weight: bold; font-size: 0.75rem; cursor: pointer;
            box-shadow: 0 0 10px rgba(217, 119, 6, 0.4); display: flex; align-items: center; gap: 6px;
        }
        .end-turn-btn:disabled { background: #334155; color: #64748b; box-shadow: none; }

        /* 地圖區域：精準設定為螢幕高度的一半 (50vh)，並鎖定游標 */
        #map-container { 
            position: relative; width: 100%; border-radius: 8px; 
            overflow: hidden; border: 1px solid var(--panel-border); 
        }
        #map { 
            height: 50vh; 
            max-height: 50vh;
            width: 100%; 
            background: #000; 
            z-index: 1; 
            cursor: default !important; /* 提示玩家無法拖曳 */
        }

        .tactical-marker {
            width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #fff; font-size: 11px;
            border: 2px solid #fff; transition: all 0.3s; cursor: pointer;
        }
        .marker-kmt { background: var(--kmt-color); box-shadow: 0 0 12px var(--kmt-color); }
        .marker-cpc { background: var(--cpc-color); box-shadow: 0 0 12px var(--cpc-color); }
        .marker-selected { transform: scale(1.25); border-color: var(--gold-accent) !important; box-shadow: 0 0 18px var(--gold-accent) !important; }

        /* 操作與日誌面板 */
        .bottom-grid {
            display: grid; grid-template-columns: 320px 1fr; gap: 8px;
        }

        .control-card {
            background: var(--panel-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border); border-radius: 8px; padding: 8px;
            display: flex; flex-direction: column; gap: 6px;
        }

        .card-header {
            font-size: 0.8rem; font-weight: bold; color: var(--gold-accent);
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px;
        }

        .mode-selector { display: flex; gap: 4px; }
        .mode-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--panel-border);
            color: var(--text-muted); padding: 3px 6px; border-radius: 4px;
            cursor: pointer; font-size: 0.7rem; transition: all 0.2s;
        }
        .mode-btn.active { background: var(--gold-accent); color: #000; font-weight: bold; }

        /* 戰術動作按鈕 */
        .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .action-card-btn {
            background: rgba(30, 41, 59, 0.8); border: 1px solid var(--panel-border);
            border-radius: 6px; padding: 6px 8px; color: var(--text-main); cursor: pointer;
            display: flex; flex-direction: column; gap: 2px; text-align: left;
        }
        .action-card-btn:disabled { opacity: 0.35; cursor: not-allowed; border-color: transparent; }
        .action-card-btn .btn-title { font-weight: bold; font-size: 0.78rem; display: flex; justify-content: space-between; }
        .action-card-btn .btn-cost { font-size: 0.65rem; color: var(--gold-accent); }
        .action-card-btn .btn-desc { font-size: 0.65rem; color: var(--text-muted); }        .action-card-btn.skill-ready { border-color: var(--gold-accent); box-shadow: 0 0 8px rgba(245,158,11,0.18); }
        .event-banner {
            display:none; margin-top:6px; padding:8px; border:1px solid var(--gold-accent);
            border-radius:6px; background:rgba(245,158,11,0.10); color:#fff;
        }
        .event-title { color:var(--gold-accent); font-weight:900; font-size:.8rem; }
        .event-desc { color:var(--text-muted); font-size:.68rem; margin:3px 0 6px; }
        .event-choices { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
        .event-choice {
            background:#111827; border:1px solid rgba(245,158,11,.45); color:#fff;
            border-radius:5px; padding:6px; cursor:pointer; font-size:.7rem;
        }
        .event-choice:hover { background:rgba(245,158,11,.18); }
        .hq-marker {
            width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
            font-size:18px; font-weight:900; border:2px solid currentColor; background:rgba(0,0,0,.88);
            box-shadow:0 0 14px currentColor; text-shadow:0 0 8px currentColor;
        }
        .hq-label {
            background:rgba(0,0,0,.86); border:1px solid currentColor; color:#fff; padding:3px 6px;
            border-radius:4px; font-weight:800; font-size:11px; white-space:nowrap;
        }
        .hq-health { font-size:10px; color:#fff; margin-top:2px; }

        .morale-row { font-size:.68rem; color:var(--text-muted); display:flex; justify-content:space-between; }
        .morale-bar { height:5px; background:#1e293b; border-radius:5px; overflow:hidden; margin-top:3px; }
        .morale-fill { height:100%; width:50%; background:linear-gradient(90deg,#f43f5e,#f59e0b,#22c55e); transition:width .25s; }


        #log-window {
            height: 95px; background: rgba(5, 8, 12, 0.95);
            border: 1px solid var(--panel-border); color: #38edf8;
            font-family: monospace; padding: 6px; overflow-y: auto;
            border-radius: 4px; font-size: 0.72rem; line-height: 1.35;
            -webkit-overflow-scrolling: touch;
        }

        .floating-num {
            position: absolute; font-size: 1.3rem; font-weight: 900; pointer-events: none;
            animation: floatUp 0.8s ease-out forwards; text-shadow: 0 0 6px rgba(0,0,0,0.9); z-index: 1000;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
            100% { opacity: 0; transform: translate(-50%, -40px) scale(1); }
        }

        /* 手機 RWD 排版 */
        @media (max-width: 768px) {
            .bottom-grid { grid-template-columns: 1fr; }
            header { flex-direction: column; gap: 4px; text-align: center; }
            .hud-bar { justify-content: space-around; }
        }
    </style>
<script>
        // PeerJS CDN 載入檢查
        window.addEventListener('DOMContentLoaded', function () {
            if (typeof window.Peer !== 'function') {
                console.error('PeerJS 載入失敗：window.Peer 不存在');
                const msg = document.createElement('div');
                msg.style.cssText = 'position:fixed;left:10px;right:10px;bottom:10px;z-index:99999;padding:12px;background:#7f1d1d;color:#fff;border:1px solid #ef4444;border-radius:8px;font-family:system-ui;';
                msg.textContent = 'PeerJS 載入失敗。請確認網路可以載入 cdnjs.cloudflare.com，或將 PeerJS 檔案下載到本機後使用。';
                document.body.appendChild(msg);
            }
        });
    </script>

</head>
<body>

    <div class="scanline"></div>

    <header>
        <div class="title-group">
            <h1><i class="fa-solid fa-satellite-dish"></i> 大戰局V2：<span>反攻戰術地圖</span></h1>
            <div class="subtitle">完全靜態鎖定 / 50% 畫面視角</div>
        </div>
        <div class="mode-selector">
            <button class="mode-btn active" id="btn-mode-ai" onclick="switchGameMode('AI')"><i class="fa-solid fa-robot"></i> AI 單人</button>
            <button class="mode-btn" id="btn-mode-p2p" onclick="switchGameMode('P2P')"><i class="fa-solid fa-network-wired"></i> P2P 雙人</button>
        </div>
    </header>

    <div id="connection-status" style="width:100%;max-width:1100px;margin:4px auto 0;padding:6px 10px;border:1px solid rgba(56,189,248,.25);border-radius:8px;background:rgba(13,19,28,.92);color:#94a3b8;font-size:.72rem;">
        <span id="connection-dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#64748b;margin-right:6px;"></span>
        <span id="connection-text">AI 單人模式就緒</span>
    </div>

    <div class="main-container">
        <!-- 戰術抬頭面板 -->
        <div class="hud-bar">
            <div class="hud-status">
                <div id="turn-badge" class="turn-badge badge-kmt">
                    <i class="fa-solid fa-shield-halved"></i> 國軍階段
                </div>
                <div class="ap-tracker">
                    <span class="ap-title">AP</span>
                    <div class="ap-dots" id="ap-dots">
                        <div class="ap-dot active"></div>
                        <div class="ap-dot active"></div>
                        <div class="ap-dot active"></div>
                    </div>
                </div>
            </div>
            <div style="display:flex; gap:6px;">
                <button class="end-turn-btn" id="btn-end-turn" onclick="endTurn()"><i class="fa-solid fa-forward"></i> 結束回合</button>
                <button class="mode-btn" style="background:#b91c1c; color:#fff;" onclick="resetGame(true)"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
        </div>

        <!-- 50% 高度 + 禁滑動放大縮小地圖 -->
        <div id="map-container">
            <div id="map"></div>
        </div>

        <div class="bottom-grid">
            <!-- 戰術控制指令卡 -->
            <div class="control-card">
                <div class="card-header">
                    <span><i class="fa-solid fa-crosshairs"></i> 目標：<b id="target-region-name" style="color:#fff;">請點選地圖區域</b></span>
                    <span id="target-region-hp" style="color:var(--text-muted);">HP: --/--</span>
                </div>
                
                <div class="actions-grid">
                    <button class="action-card-btn" id="act-attack" onclick="executeTacticalAction('ATTACK')" disabled>
                        <div class="btn-title"><span><i class="fa-solid fa-burst"></i> 強襲</span><span class="btn-cost">2 AP</span></div>
                        <div class="btn-desc">造成 25-45 點傷害</div>
                    </button>

                    <button class="action-card-btn" id="act-raid" onclick="executeTacticalAction('RAID')" disabled>
                        <div class="btn-title"><span><i class="fa-solid fa-skull"></i> 奇襲</span><span class="btn-cost">1 AP</span></div>
                        <div class="btn-desc">15 傷害 (35% 機率暴擊 50)</div>
                    </button>

                    <button class="action-card-btn" id="act-fortify" onclick="executeTacticalAction('FORTIFY')" disabled>
                        <div class="btn-title"><span><i class="fa-solid fa-shield"></i> 加固</span><span class="btn-cost">1 AP</span></div>
                        <div class="btn-desc">修復駐軍防線 +25 HP</div>
                    </button>

                    <button class="action-card-btn" id="act-conscript" onclick="executeTacticalAction('CONSCRIPT')" disabled>
                        <div class="btn-title"><span><i class="fa-solid fa-user-plus"></i> 徵兵</span><span class="btn-cost">2 AP</span></div>
                        <div class="btn-desc">提升區域上限 (+20)</div>
                    </button>
                </div>

                <div class="card-header" style="margin-top:2px;">
                    <span><i class="fa-solid fa-bolt"></i> 特殊技能</span>
                    <span id="skill-points" style="color:var(--gold-accent);">SP: 2</span>
                </div>
                <div class="actions-grid">
                    <button class="action-card-btn" id="skill-surge" onclick="useSpecialSkill('SURGE')">
                        <div class="btn-title"><span><i class="fa-solid fa-bolt"></i> 戰術脈衝</span><span class="btn-cost">1 SP</span></div>
                        <div class="btn-desc">本回合下一次攻擊 +12 傷害，並恢復 5 士氣</div>
                    </button>
                    <button class="action-card-btn" id="skill-shield" onclick="useSpecialSkill('SHIELD')">
                        <div class="btn-title"><span><i class="fa-solid fa-shield-halved"></i> 緊急防護</span><span class="btn-cost">1 SP</span></div>
                        <div class="btn-desc">選定己方區域獲得 20 點臨時防護</div>
                    </button>
                    <button class="action-card-btn" id="skill-rally" onclick="useSpecialSkill('RALLY')">
                        <div class="btn-title"><span><i class="fa-solid fa-flag"></i> 全線集結</span><span class="btn-cost">2 SP</span></div>
                        <div class="btn-desc">所有己方區域 +10 HP，上限不變</div>
                    </button>
                    <button class="action-card-btn" id="skill-scan" onclick="useSpecialSkill('SCAN')">
                        <div class="btn-title"><span><i class="fa-solid fa-eye"></i> 戰術預判</span><span class="btn-cost">1 SP</span></div>
                        <div class="btn-desc">查看下一回合事件提示，並獲得 1 AP</div>
                    </button>
                </div>

                <div id="p2p-panel" style="display: none; flex-direction: column; gap:4px; border-top:1px solid rgba(255,255,255,0.1); padding-top:6px;">
                    <div style="font-size:0.7rem; color:var(--gold-accent);">
                        自訂房間 ID：
                        <input type="text" id="room-id" maxlength="32"
                            placeholder="例如 MyRoom123"
                            style="background:#000; border:1px solid var(--panel-border); color:#fff; padding:4px; font-size:0.75rem; border-radius:4px; width:150px;">
                        <button class="mode-btn" style="background:var(--gold-accent); color:#000; font-weight:bold;" onclick="createRoom()">建立房間</button>
                    </div>
                    <div style="display:flex; gap:4px;">
                        <input type="text" id="join-id" maxlength="32"
                            placeholder="輸入對手房間 ID"
                            style="background:#000; border:1px solid var(--panel-border); color:#fff; padding:4px; font-size:0.75rem; border-radius:4px; flex:1;">
                        <button class="mode-btn" style="background:var(--gold-accent); color:#000; font-weight:bold;" onclick="connectToPeer()">加入房間</button>
                    </div>
                    <div style="font-size:0.65rem; color:var(--text-muted);">
                        <span id="my-id">尚未建立房間</span>
                    </div>
                </div>
            </div>

            <!-- 戰況日誌 -->
            <div class="control-card">
                <div class="card-header">
                    <span><i class="fa-solid fa-terminal"></i> 戰術動態 Log</span>
                    <span style="font-size: 0.7rem; color: var(--text-muted);" id="round-indicator">ROUND 1</span>
                </div>
                <div style="font-size:.66rem;color:#fbbf24;margin:2px 0 5px;">共軍優勢：4 區開局｜4 AP｜高耐久｜縱深防禦｜北京總部護衛</div>
                <div class="morale-row"><span>雙方士氣</span><span id="morale-label">50 / 50</span></div>
                <div class="morale-bar"><div id="morale-fill" class="morale-fill"></div></div>
                <div id="hq-panel" class="event-banner" style="display:block; border-color:rgba(0,243,255,.45); background:rgba(0,243,255,.05);">
                    <div class="event-title" style="color:var(--neon-blue);">🏛️ 雙方總部</div>
                    <div id="hq-status" class="event-desc"></div>
                    <div style="font-size:.66rem;color:#fbbf24;margin-top:4px;">⚠ 共軍優勢規則：4 區開局、北京總部 220 HP、縱深防禦與額外 AP。</div>
                </div>
                <div id="event-banner" class="event-banner">
                    <div id="event-title" class="event-title"></div>
                    <div id="event-desc" class="event-desc"></div>
                    <div id="event-choices" class="event-choices"></div>
                </div>
                <div id="log-window"></div>
            </div>
        </div>
    </div>

    <script>
        const initialRegions = [
            // 共軍開局控制 4 個戰區，並擁有較高的區域耐久與「縱深防禦」層數。
            { id: 'northeast', name: '東北 (瀋陽)', owner: 'CPC', hp: 115, maxHp: 115, fortress: 2, lat: 41.83, lng: 123.43 },
            { id: 'north', name: '華北 (北京)', owner: 'CPC', hp: 120, maxHp: 120, fortress: 3, lat: 39.90, lng: 116.40 },
            { id: 'east', name: '華東 (南京)', owner: 'CPC', hp: 115, maxHp: 115, fortress: 2, lat: 32.06, lng: 118.79 },
            { id: 'south', name: '華南 (廣州)', owner: 'CPC', hp: 115, maxHp: 115, fortress: 2, lat: 23.12, lng: 113.26 },
            { id: 'southwest', name: '大西南 (成都)', owner: 'KMT', hp: 100, maxHp: 100, fortress: 0, lat: 30.57, lng: 104.06 },
            { id: 'taiwan', name: '台灣 (台北基地)', owner: 'KMT', hp: 100, maxHp: 100, fortress: 0, lat: 25.03, lng: 121.56 }
        ];

        // 雙方總部：國軍總部固定在台灣，共軍總部固定在北京。
        const headquarters = {
            KMT: { regionId: 'taiwan', name: '國軍總部', location: '台灣（台北）', lat: 25.03, lng: 121.56, hp: 180, maxHp: 180 },
            CPC: { regionId: 'north', name: '共軍總部', location: '北京', lat: 39.90, lng: 116.40, hp: 220, maxHp: 220 }
        };

        let map, markers = {}, polylineGroup = null;
        let gameMode = 'AI';
        const MAX_AP = 3;
        const CPC_MAX_AP = 4;
        const MAX_SP = 3;
        const CPC_MAX_SP = 5;
        function getMaxAP(side) { return side === 'CPC' ? CPC_MAX_AP : MAX_AP; }
        function getMaxSP(side) { return side === 'CPC' ? CPC_MAX_SP : MAX_SP; }
        let gameState = { turn: 'KMT', ap: getMaxAP('KMT'), round: 1, regions: JSON.parse(JSON.stringify(initialRegions)) };
        let selectedRegionId = null;
        let myRole = 'KMT';
        let peer = null, conn = null, isAiThinking = false, gameOver = false, pendingPeerId = null;
        let reconnectTimer = null, peerConnecting = false, connectionTimeout = null;
        let specialState = { KMT: { sp: 2, morale: 50, shield: 0, surge: 0 }, CPC: { sp: 3, morale: 55, shield: 0, surge: 0 } };
        let pendingEvent = false, nextEventHint = null;
        let hqState = JSON.parse(JSON.stringify(headquarters));

        function initMap() {
            // 初始化靜態鎖定地圖 (絕對禁止移動與縮放)
            map = L.map('map', {
                center: [30.0, 112.0],        // 最佳中央座標 (包含全中國與台灣)
                zoom: 4,                      // 固定縮放等級
                zoomControl: false,           // 移除 +/- 縮放按鈕
                dragging: false,              // 關閉滑鼠/觸控拖曳
                touchZoom: false,             // 關閉雙指縮放
                scrollWheelZoom: false,       // 關閉滾輪縮放
                doubleClickZoom: false,       // 關閉雙擊縮放
                boxZoom: false,               // 關閉拉框縮放
                keyboard: false               // 關閉方向鍵微調
            });

            // CartoDB 暗黑地圖
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap', subdomains: 'abcd'
            }).addTo(map);

            window.addEventListener('resize', () => map.invalidateSize());

            polylineGroup = L.layerGroup().addTo(map);
            renderMapElements();
        }

        function selectRegion(id) {
            selectedRegionId = id;
            renderMapElements();
            updateActionButtonStates();
        }

        function renderMapElements() {
            polylineGroup.clearLayers();
            const taiwanRegion = gameState.regions.find(r => r.id === 'taiwan');

            gameState.regions.forEach(region => {
                const isKmt = region.owner === 'KMT';
                const isSelected = region.id === selectedRegionId;

                if (!markers[region.id]) {
                    const customIcon = L.divIcon({
                        className: 'custom-map-icon',
                        html: `<div id="icon-${region.id}" class="tactical-marker ${isKmt ? 'marker-kmt' : 'marker-cpc'} ${isSelected ? 'marker-selected' : ''}">
                                <i class="fa-solid ${isKmt ? 'fa-shield-halved' : 'fa-flag'}"></i>
                               </div>`,
                        iconSize: [30, 30], iconAnchor: [15, 15]
                    });

                    const marker = L.marker([region.lat, region.lng], { icon: customIcon }).addTo(map);
                    marker.on('click', () => selectRegion(region.id));
                    markers[region.id] = marker;
                } else {
                    const iconEl = document.getElementById(`icon-${region.id}`);
                    if (iconEl) {
                        iconEl.className = `tactical-marker ${isKmt ? 'marker-kmt' : 'marker-cpc'} ${isSelected ? 'marker-selected' : ''}`;
                    }
                }

                if (region.id !== 'taiwan' && taiwanRegion) {
                    const line = L.polyline([[taiwanRegion.lat, taiwanRegion.lng], [region.lat, region.lng]], {
                        color: isKmt ? '#38bdf8' : '#f43f5e', weight: isSelected ? 2.5 : 1, opacity: 0.5, dashArray: '4, 6'
                    });
                    polylineGroup.addLayer(line);
                }
            });

            updateHUD();
        
            renderHeadquarters();}

        function updateHUD() {
            const isMyTurn = gameState.turn === myRole;
            const badge = document.getElementById('turn-badge');
            const endBtn = document.getElementById('btn-end-turn');

            if (gameState.turn === 'KMT') {
                badge.className = "turn-badge badge-kmt";
                badge.innerHTML = `<i class="fa-solid fa-shield-halved"></i> 國軍階段 ${isMyTurn ? '(你)' : ''}`;
            } else {
                badge.className = "turn-badge badge-cpc";
                badge.innerHTML = `<i class="fa-solid fa-flag"></i> 共軍階段 ${gameMode === 'AI' ? '(電腦)' : (isMyTurn ? '(你)' : '')}`;
            }

            endBtn.disabled = !isMyTurn || isAiThinking || gameOver;

            const apContainer = document.getElementById('ap-dots');
            apContainer.innerHTML = '';
            for (let i = 0; i < getMaxAP(gameState.turn); i++) {
                const dot = document.createElement('div');
                dot.className = `ap-dot ${i < gameState.ap ? 'active' : ''}`;
                apContainer.appendChild(dot);
            }

            document.getElementById('round-indicator').innerText = `ROUND ${gameState.round}`;

            const targetName = document.getElementById('target-region-name');
            const targetHp = document.getElementById('target-region-hp');

            if (selectedRegionId) {
                const region = gameState.regions.find(r => r.id === selectedRegionId);
                targetName.innerText = `${region.name}`;
                targetHp.innerText = `HP: ${Math.max(0, region.hp)}/${region.maxHp}${region.owner === 'CPC' ? ` · 縱深 ${region.fortress || 0}` : ''}`;
            } else {
                targetName.innerText = "請選擇區域";
                targetHp.innerText = "HP: --/--";
            }
        }

        function updateActionButtonStates() {
            const isMyTurn = gameState.turn === myRole && !isAiThinking && !gameOver && !pendingEvent;
            const region = gameState.regions.find(r => r.id === selectedRegionId);
            const btnAttack = document.getElementById('act-attack');
            const btnRaid = document.getElementById('act-raid');
            const btnFortify = document.getElementById('act-fortify');
            const btnConscript = document.getElementById('act-conscript');

            if (!region || !isMyTurn) {
                [btnAttack, btnRaid, btnFortify, btnConscript].forEach(btn => btn.disabled = true);
            } else {
                const isEnemy = region.owner !== myRole;
                btnAttack.disabled = !isEnemy || gameState.ap < 2;
                btnRaid.disabled = !isEnemy || gameState.ap < 1;
                btnFortify.disabled = isEnemy || gameState.ap < 1;
                btnConscript.disabled = isEnemy || gameState.ap < 2;
            }

            updateSkillButtons();
            updateMoraleUI();
        }

        function updateSkillButtons() {
            const side = specialState[myRole];
            const active = gameState.turn === myRole && !isAiThinking && !gameOver && !pendingEvent;
            const ids = ['skill-surge','skill-shield','skill-rally','skill-scan'];
            ids.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.disabled = !active;
            });
            const costs = { 'skill-surge':1, 'skill-shield':1, 'skill-rally':2, 'skill-scan':1 };
            ids.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.disabled = el.disabled || side.sp < costs[id];
            });
            const spEl = document.getElementById('skill-points');
            if (spEl) spEl.textContent = `SP: ${side.sp}`;
        }

        function updateMoraleUI() {
            const k = specialState.KMT.morale, c = specialState.CPC.morale;
            const label = document.getElementById('morale-label');
            const fill = document.getElementById('morale-fill');
            if (label) label.textContent = `國軍 ${k} / 共軍 ${c}`;
            if (fill) fill.style.width = `${Math.max(5, Math.min(95, 50 + (k-c)/2))}%`;
        }

        function changeMorale(side, delta) {
            specialState[side].morale = Math.max(0, Math.min(100, specialState[side].morale + delta));
            updateMoraleUI();
        }

        function executeTacticalAction(type) {
            if (gameOver || gameState.turn !== myRole || isAiThinking || !selectedRegionId || pendingEvent) return;
            const region = gameState.regions.find(r => r.id === selectedRegionId);
            if (!region) return;

            const costs = { ATTACK: 2, RAID: 1, FORTIFY: 1, CONSCRIPT: 2 };
            const apCost = costs[type];
            if (!apCost || gameState.ap < apCost) return;

            const isEnemy = region.owner !== myRole;
            if ((type === 'ATTACK' || type === 'RAID') && !isEnemy) return;
            if ((type === 'FORTIFY' || type === 'CONSCRIPT') && isEnemy) return;

            let logMsg = "", animText = "", animColor = "#f43f5e";

            if (type === 'ATTACK') {
                let damage = Math.floor(Math.random() * 16) + 27;
                if (specialState[myRole].surge > 0) {
                    damage += specialState[myRole].surge;
                    specialState[myRole].surge = 0;
                    logMsg += "【戰術脈衝】 ";
                }
                if (region.owner === 'CPC' && (region.fortress || 0) > 0) {
                    damage = Math.max(1, damage - 8);
                    region.fortress -= 1;
                    logMsg += '【縱深防禦 -8】 ';
                }
                if (region.owner === 'CPC' && (region.fortress || 0) > 0) {
                    damage = Math.max(1, damage - 8);
                    region.fortress -= 1;
                    logMsg += '【縱深防禦 -8】 ';
                }
                damage = Math.max(1, damage - specialState[region.owner].shield);
                specialState[region.owner].shield = 0;
                region.hp -= damage;
                const targetSide = region.owner;
                if (headquarters[targetSide] && headquarters[targetSide].regionId === region.id) {
                    damageHQ(targetSide, Math.ceil(damage * 0.45));
                }
                animText = `-${damage}`;
                logMsg += `${myRole === 'KMT' ? '國軍' : '共軍'} 強襲 [${region.name}] -${damage} HP`;
                changeMorale(myRole, 3);
                changeMorale(region.owner, -3);
            } else if (type === 'RAID') {
                let damage = Math.random() < 0.35 ? 48 : 18;
                if (specialState[myRole].surge > 0) {
                    damage += specialState[myRole].surge;
                    specialState[myRole].surge = 0;
                    logMsg += "【戰術脈衝】 ";
                }
                damage = Math.max(1, damage - specialState[region.owner].shield);
                specialState[region.owner].shield = 0;
                region.hp -= damage;
                animText = `-${damage}`;
                animColor = "#a855f7";
                logMsg += `${myRole === 'KMT' ? '國軍' : '共軍'} 奇襲 [${region.name}] -${damage} HP`;
                changeMorale(myRole, 2);
                changeMorale(region.owner, -2);
            } else if (type === 'FORTIFY') {
                region.hp = Math.min(region.maxHp, region.hp + 25);
                animText = `+25`; animColor = "#22c55e";
                logMsg = `${myRole === 'KMT' ? '國軍' : '共軍'} 加固 [${region.name}] +25 HP`;
                changeMorale(myRole, 2);
            } else if (type === 'CONSCRIPT') {
                region.maxHp += 20; region.hp += 20;
                animText = `上限+20`; animColor = "#38bdf8";
                logMsg = `${myRole === 'KMT' ? '國軍' : '共軍'} [${region.name}] 徵兵，上限提升`;
                changeMorale(myRole, 1);
            }

            gameState.ap -= apCost;

            if (region.hp <= 0) {
                const oldOwner = region.owner;
                region.hp = 50;
                region.owner = myRole;
                changeMorale(myRole, 8);
                changeMorale(oldOwner, -8);
                logMsg += ` (成功佔領該區域！)`;
            }

            showMapFloatingNum(region.lat, region.lng, animText, animColor);
            log(logMsg);
            renderMapElements();
            updateActionButtonStates();

            if (gameMode === 'P2P') {
                sendData({
                    type: 'ACTION',
                    gameState: gameState,
                    specialState: specialState,
                    hqState: hqState,
                    msg: logMsg,
                    anim: { lat: region.lat, lng: region.lng, text: animText, color: animColor }
                });
            }

            checkWin();

            // 每次主要行動都有機率觸發突發事件，讓戰局有二選一。
            if (!gameOver && Math.random() < 0.38) {
                triggerEmergencyEvent();
            }
        }

        function endTurn() {
            if (gameOver || gameState.turn !== myRole || isAiThinking || pendingEvent) return;

            gameState.turn = gameState.turn === 'KMT' ? 'CPC' : 'KMT';
            gameState.ap = getMaxAP(gameState.turn);
            gameState.round += 1;
            specialState[gameState.turn].sp = Math.min(getMaxSP(gameState.turn), specialState[gameState.turn].sp + 1);
            if (gameState.turn === 'CPC') {
                // 共軍的後方補給：每個共軍區域少量恢復，並重新建立部分縱深防禦。
                gameState.regions.filter(r => r.owner === 'CPC').forEach(r => {
                    r.hp = Math.min(r.maxHp, r.hp + 5);
                    r.fortress = Math.min(3, (r.fortress || 0) + 1);
                });
                log('【共軍規則】後方補給啟動：共軍區域 +5 HP，部分縱深防禦恢復。');
            }

            log(`--- 切換至 [${gameState.turn === 'KMT' ? '國軍' : '共軍'}] 行動階段 ---`);
            renderMapElements();
            updateActionButtonStates();

            if (gameMode === 'P2P') {
                sendData({ type: 'END_TURN', gameState, specialState, hqState, msg: `對手已結束回合` });
            }

            if (gameMode === 'AI' && gameState.turn === 'CPC') {
                aiTurnEngine();
            }
        }

        function aiTurnEngine() {
            if (gameOver) return;
            isAiThinking = true;
            updateHUD();
            updateActionButtonStates();

            let aiAp = getMaxAP('CPC');
            // 共軍回合開始：額外恢復縱深防禦，讓玩家需要持續突破。
            gameState.regions.filter(r => r.owner === 'CPC').forEach(r => {
                r.fortress = Math.min(3, (r.fortress || 0) + 1);
                r.hp = Math.min(r.maxHp, r.hp + 5);
            });
            const aiInterval = setInterval(() => {
                const kmtRegions = gameState.regions.filter(r => r.owner === 'KMT');
                const cpcRegions = gameState.regions.filter(r => r.owner === 'CPC');

                if (aiAp >= 2 && kmtRegions.length > 0) {
                    kmtRegions.sort((a, b) => a.hp - b.hp);
                    const target = kmtRegions[0];
                    let dmg = 32 + Math.floor(Math.random() * 17);
                    if (specialState.CPC.surge > 0) { dmg += specialState.CPC.surge; specialState.CPC.surge = 0; }
                    dmg = Math.max(1, dmg - specialState.KMT.shield);
                    specialState.KMT.shield = 0;
                    target.hp -= dmg;
                    if (headquarters.KMT.regionId === target.id) {
                        damageHQ('KMT', Math.ceil(dmg * 0.45));
                    }
                    aiAp -= 2;
                    changeMorale('CPC', 3); changeMorale('KMT', -3);

                    showMapFloatingNum(target.lat, target.lng, `-${dmg}`, "#f43f5e");
                    let msg = `電腦 AI 強襲攻打 [${target.name}] (-${dmg})`;
                    if (target.hp <= 0) {
                        target.hp = 50; target.owner = 'CPC';
                        changeMorale('CPC', 8); changeMorale('KMT', -8);
                        msg += ` (已佔領)`;
                    }
                    log(msg);
                } else if (aiAp >= 1 && cpcRegions.length > 0) {
                    cpcRegions.sort((a, b) => a.hp - b.hp);
                    const target = cpcRegions[0];
                    target.hp = Math.min(target.maxHp, target.hp + 25);
                    aiAp -= 1;
                    changeMorale('CPC', 2);
                    showMapFloatingNum(target.lat, target.lng, `+25`, "#22c55e");
                    log(`電腦 AI 加固 [${target.name}] 防線`);
                } else {
                    aiAp = 0;
                }

                // AI 偶爾使用特殊技能，效果與玩家對稱。
                if (specialState.CPC.sp > 0 && Math.random() < 0.40) {
                    const roll = Math.random();
                    if (roll < 0.34) {
                        specialState.CPC.sp--; specialState.CPC.surge = 16;
                        log(`AI 使用【戰術脈衝】`);
                    } else if (roll < 0.67) {
                        specialState.CPC.sp--; specialState.CPC.shield = 30;
                        log(`AI 使用【緊急防護】`);
                    } else if (specialState.CPC.sp >= 2) {
                        specialState.CPC.sp -= 2;
                        cpcRegions.forEach(r => r.hp = Math.min(r.maxHp, r.hp + 15));
                        log(`AI 使用【全線集結】`);
                    }
                }

                renderMapElements();

                if (aiAp <= 0 || checkWin()) {
                    clearInterval(aiInterval);
                    gameState.turn = 'KMT';
                    gameState.ap = MAX_AP;
                    specialState.KMT.sp = Math.min(getMaxSP('KMT'), specialState.KMT.sp + 1);
                    isAiThinking = false;
                    log(`--- 電腦 AI 結束回合，輪至你的階段 ---`);
                    renderMapElements();
                    updateActionButtonStates();
                    if (!gameOver && Math.random() < 0.45) triggerEmergencyEvent();
                }
            }, 800);
        }

        function useSpecialSkill(type) {
            if (gameOver || pendingEvent || gameState.turn !== myRole || isAiThinking) return;
            const side = specialState[myRole];
            const region = gameState.regions.find(r => r.id === selectedRegionId);
            const costs = { SURGE:1, SHIELD:1, RALLY:2, SCAN:1 };
            if (side.sp < costs[type]) return;

            if ((type === 'SHIELD') && (!region || region.owner !== myRole)) {
                log('【緊急防護】請先選擇己方區域。');
                return;
            }

            side.sp -= costs[type];

            if (type === 'SURGE') {
                side.surge = myRole === 'CPC' ? 16 : 12;
                changeMorale(myRole, 5);
                log(`${myRole === 'KMT' ? '國軍' : '共軍'} 啟動【戰術脈衝】：下一次攻擊 +12。`);
            } else if (type === 'SHIELD') {
                side.shield = myRole === 'CPC' ? 30 : 20;
                log(`${myRole === 'KMT' ? '國軍' : '共軍'} 啟動【緊急防護】：下一次受擊減免 20。`);
            } else if (type === 'RALLY') {
                gameState.regions.filter(r => r.owner === myRole)
                    .forEach(r => r.hp = Math.min(r.maxHp, r.hp + (myRole === 'CPC' ? 15 : 10)));
                changeMorale(myRole, 8);
                log(`${myRole === 'KMT' ? '國軍' : '共軍'} 啟動【全線集結】：全線 +10 HP。`);
            } else if (type === 'SCAN') {
                gameState.ap = Math.min(MAX_AP, gameState.ap + 1);
                nextEventHint = getRandomEvent(true);
                log(`【戰術預判】下一個突發事件提示：${nextEventHint.title}`);
            }

            renderMapElements();
            updateActionButtonStates();

            if (gameMode === 'P2P') {
                sendData({ type:'SKILL', skill:type, gameState, specialState, msg:`對手使用特殊技能 ${type}` });
            }
        }

        const emergencyEvents = [
            {
                title:'⚠️ 緊急補給：只能選一個！',
                desc:'前線補給抵達，但資源有限。你要強化前線還是保存資源？',
                a:{text:'A：前線補給 +25 HP', fn:()=> {
                    const r = gameState.regions.find(x=>x.owner===myRole);
                    if(r) r.hp=Math.min(r.maxHp,r.hp+25);
                    changeMorale(myRole,4);
                    log('事件選擇 A：前線補給完成。');
                }},
                b:{text:'B：保存資源 +1 SP', fn:()=> {
                    specialState[myRole].sp=Math.min(getMaxSP(myRole),specialState[myRole].sp+1);
                    log('事件選擇 B：保存資源，特殊技能點 +1。');
                }}
            },
            {
                title:'🛰️ 情報異常：立即決策！',
                desc:'偵測到敵方調動。你可以冒險搶先行動，或穩住防線。',
                a:{text:'A：快速反應 +1 AP', fn:()=> {
                    gameState.ap=Math.min(MAX_AP,gameState.ap+1);
                    changeMorale(myRole,3);
                    log('事件選擇 A：快速反應，AP +1。');
                }},
                b:{text:'B：穩固陣線 +15 HP', fn:()=> {
                    const r=gameState.regions.find(x=>x.owner===myRole);
                    if(r) r.hp=Math.min(r.maxHp,r.hp+15);
                    changeMorale(myRole,2);
                    log('事件選擇 B：穩固陣線，前線 +15 HP。');
                }}
            },
            {
                title:'📡 通訊干擾：二選一',
                desc:'短暫干擾影響指揮系統。你只能選擇一種應對方式。',
                a:{text:'A：集中指揮，士氣 +8', fn:()=>{ changeMorale(myRole,8); log('事件選擇 A：集中指揮，士氣提升。'); }},
                b:{text:'B：分散備援，所有己方 +8 HP', fn:()=>{
                    gameState.regions.filter(r=>r.owner===myRole).forEach(r=>r.hp=Math.min(r.maxHp,r.hp+8));
                    log('事件選擇 B：分散備援，所有己方區域 +8 HP。');
                }}
            }
        ];

        function getRandomEvent(preview=false) {
            const e = emergencyEvents[Math.floor(Math.random()*emergencyEvents.length)];
            return preview ? e : e;
        }

        function triggerEmergencyEvent() {
            if (pendingEvent || gameOver) return;
            pendingEvent = true;
            const event = nextEventHint || getRandomEvent();
            nextEventHint = null;

            document.getElementById('event-title').textContent = event.title;
            document.getElementById('event-desc').textContent = event.desc;
            const choices = document.getElementById('event-choices');
            choices.innerHTML = '';

            const a = document.createElement('button');
            a.className = 'event-choice'; a.textContent = event.a.text;
            a.onclick = () => resolveEmergencyEvent(event, event.a);
            const b = document.createElement('button');
            b.className = 'event-choice'; b.textContent = event.b.text;
            b.onclick = () => resolveEmergencyEvent(event, event.b);

            choices.append(a,b);
            document.getElementById('event-banner').style.display = 'block';
            log(`⚠️ ${event.title} 請立即二選一！`);
            updateActionButtonStates();
        }

        function resolveEmergencyEvent(event, choice) {
            choice.fn();
            pendingEvent = false;
            document.getElementById('event-banner').style.display = 'none';
            updateActionButtonStates();

            if (gameMode === 'P2P') {
                sendData({
                    type:'EVENT_RESULT',
                    gameState,
                    specialState,
                    hqState,
                    msg:'對手完成突發事件選擇'
                });
            }
            renderMapElements();
            checkWin();
        }

        function showMapFloatingNum(lat, lng, text, color) {
            const point = map.latLngToContainerPoint([lat, lng]);
            const num = document.createElement('div');
            num.className = 'floating-num';
            num.innerText = text;
            num.style.color = color;
            num.style.left = `${point.x}px`;
            num.style.top = `${point.y}px`;
            document.getElementById('map-container').appendChild(num);
            setTimeout(() => num.remove(), 800);
        }

        function updateHQStatus() {
            const el = document.getElementById('hq-status');
            if (!el) return;
            const k = hqState.KMT, c = hqState.CPC;
            el.innerHTML = `國軍總部：${k.location} HP ${Math.max(0,k.hp)}/${k.maxHp}<br>共軍總部：${c.location} HP ${Math.max(0,c.hp)}/${c.maxHp}`;
        }

        function renderHeadquarters() {
            updateHQStatus();
        }

        function damageHQ(side, amount) {
            if (!hqState[side] || hqState[side].hp <= 0) return;
            if (side === 'CPC') {
                const mainlandLost = gameState.regions.filter(r => r.id !== 'taiwan' && r.owner === 'KMT').length;
                if (mainlandLost < 2) {
                    amount = Math.max(1, Math.floor(amount * 0.5));
                    log('【北京總部護衛】共軍尚保有大部分縱深，總部傷害減半。');
                }
            }
            hqState[side].hp = Math.max(0, hqState[side].hp - amount);
            log(`【${hqState[side].name}】受到 ${amount} 點戰局傷害。`);
            updateHQStatus();
            if (hqState[side].hp <= 0) {
                gameOver = true;
                isAiThinking = false;
                alert(`【總部失守】${hqState[side].name} 防線崩潰，戰局結束！`);
                updateHUD();
                updateActionButtonStates();
            }
        }

        function checkWin() {
            const kmtCount = gameState.regions.filter(r => r.owner === 'KMT').length;
            const cpcCount = gameState.regions.filter(r => r.owner === 'CPC').length;

            if (cpcCount === 0) {
                gameOver = true;
                isAiThinking = false;
                alert("【勝利】光復所有重鎮，戰局結束！");
                updateHUD();
                updateActionButtonStates();
                return true;
            }
            if (kmtCount === 0) {
                gameOver = true;
                isAiThinking = false;
                alert("【敗北】防線被攻破，戰局結束！");
                updateHUD();
                updateActionButtonStates();
                return true;
            }
            return false;
        }

        function setConnectionStatus(text, state = 'idle') {
            const label = document.getElementById('connection-text');
            const dot = document.getElementById('connection-dot');
            if (label) label.textContent = text;
            if (dot) {
                dot.style.background =
                    state === 'success' ? '#22c55e' :
                    state === 'error' ? '#ef4444' :
                    state === 'connecting' ? '#f59e0b' : '#64748b';
            }
        }

        function clearConnectionTimeout() {
            if (connectionTimeout) {
                clearTimeout(connectionTimeout);
                connectionTimeout = null;
            }
        }

        function startConnectionTimeout(label) {
            clearConnectionTimeout();
            connectionTimeout = setTimeout(() => {
                connectionTimeout = null;
                if (!conn || !conn.open) {
                    setConnectionStatus(label + ' 連線逾時，請檢查兩端網路或嘗試不同網路。', 'error');
                    log('P2P 連線逾時：WebRTC DataChannel 尚未建立');
                }
            }, 15000);
        }

        function initPeer(customId = null) {
            // 已經有可用 Peer 時直接使用。
            if (peer && !peer.destroyed) return peer;

            peerConnecting = true;
            setConnectionStatus('正在連線 PeerJS 訊號伺服器…', 'connecting');

            // 使用 PeerJS Cloud 官方預設 signalling server。
            // 增加多個 STUN，改善不同網路環境下的 WebRTC 穿透成功率。
            // 注意：若兩端都處於 symmetric NAT，仍可能需要自有 TURN server。
            const peerOptions = {
                debug: 2,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun.cloudflare.com:3478' }
                    ],
                    sdpSemantics: 'unified-plan'
                }
            };

            try {
                peer = customId
                    ? new Peer(customId, peerOptions)
                    : new Peer(peerOptions);
            } catch (err) {
                peerConnecting = false;
                log(`P2P 建立失敗：${err.message || err}`);
                return null;
            }

            peer.on('open', (id) => {
                peerConnecting = false;

                const idEl = document.getElementById('my-id');
                if (idEl) idEl.innerText = `房間：${id}`;

                setConnectionStatus(`PeerJS 已連線，房間 ID：${id}`, 'success');
                log(`P2P 訊號伺服器已連線：${id}`);

                // 加入房間時，如果本機 Peer 尚未 open，這裡才真正連線。
                if (pendingPeerId) {
                    const targetId = pendingPeerId;
                    pendingPeerId = null;
                    setTimeout(() => connectToPeerId(targetId), 100);
                }
            });

            peer.on('connection', (incoming) => {
                // 房主只接受第一條有效連線。
                if (conn && (conn.open || conn._pending)) {
                    incoming.close();
                    return;
                }

                conn = incoming;
                myRole = 'KMT';
                setConnectionStatus(`對手 ${incoming.peer} 已找到，正在建立 WebRTC…`, 'connecting');
                log(`對手已加入房間，等待 P2P 通道建立...`);
                startConnectionTimeout('房主');
                setupConnection(conn, true);
            });

            peer.on('disconnected', () => {
                setConnectionStatus('PeerJS 訊號伺服器斷線，正在重新連線…', 'connecting');
                log(`P2P 訊號伺服器斷線，正在嘗試重新連線...`);

                clearTimeout(reconnectTimer);
                reconnectTimer = setTimeout(() => {
                    if (peer && peer.disconnected && !peer.destroyed) {
                        try {
                            peer.reconnect();
                        } catch (err) {
                            log(`P2P 重連失敗：${err.message || err}`);
                        }
                    }
                }, 1500);
            });

            peer.on('close', () => {
                peerConnecting = false;
                log(`P2P Peer 已關閉。`);
            });

            peer.on('error', (err) => {
                peerConnecting = false;

                const type = err && err.type ? err.type : 'unknown';
                const messages = {
                    'network': '無法連到 PeerJS 訊號伺服器。請確認網路沒有封鎖 HTTPS/443。',
                    'server-error': 'PeerJS 伺服器無法連線。',
                    'socket-error': 'WebSocket 連線發生錯誤。',
                    'socket-closed': 'WebSocket 連線意外關閉。',
                    'unavailable-id': '這個房間 ID 已經有人使用，請換一個。',
                    'peer-unavailable': '找不到這個房間，請確認房間 ID。',
                    'invalid-id': '房間 ID 格式不正確。',
                    'browser-incompatible': '目前瀏覽器不支援必要的 WebRTC 功能。',
                    'webrtc': 'WebRTC 建立 P2P 連線失敗。'
                };

                const detail = messages[type] || err.message || '未知錯誤';
                setConnectionStatus(`P2P 錯誤：${detail}`, 'error');
                log(`P2P 錯誤 [${type}]：${detail}`);

                // network / socket 類問題：保留 Peer，讓 disconnected 事件負責 reconnect。
                if (type === 'network' || type === 'socket-error' || type === 'socket-closed') {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = setTimeout(() => {
                        if (peer && peer.disconnected && !peer.destroyed) {
                            try {
                                peer.reconnect();
                                log(`正在重新連接 PeerJS...`);
                            } catch (e) {
                                log(`重新連接失敗：${e.message || e}`);
                            }
                        }
                    }, 2000);
                }
            });

            return peer;
        }

        function createRoom() {
            const roomId = document.getElementById('room-id').value.trim();

            if (!roomId) {
                return alert("請輸入自訂房間 ID！");
            }

            // PeerJS 自訂 ID：開頭/結尾必須是英數字，中間可有 - 或 _。
            if (!/^[A-Za-z0-9](?:[A-Za-z0-9_-]{0,30}[A-Za-z0-9])?$/.test(roomId)) {
                return alert("房間 ID 必須以英數字開頭與結尾，中間只能使用英數字、_、-，最多 32 字元。");
            }

            if (peer && !peer.destroyed) {
                if (peer.id === roomId && !peer.disconnected) {
                    log(`目前已經是房間：${roomId}`);
                    return;
                }

                try { peer.destroy(); } catch (_) {}
                peer = null;
            }

            if (conn) {
                try { conn.close(); } catch (_) {}
                conn = null;
            }

            pendingPeerId = null;
            myRole = 'KMT';
            setConnectionStatus(`正在建立房間「${roomId}」…`, 'connecting');
            log(`正在建立房間：${roomId} ...`);
            initPeer(roomId);
        }

        function connectToPeer() {
            const targetId = document.getElementById('join-id').value.trim();

            if (!targetId) {
                return alert("請輸入要加入的房間 ID！");
            }

            if (!/^[A-Za-z0-9](?:[A-Za-z0-9_-]{0,30}[A-Za-z0-9])?$/.test(targetId)) {
                return alert("房間 ID 格式不正確。");
            }

            // 加入者使用 PeerJS 自動產生自己的 Peer ID。
            if (!peer || peer.destroyed) {
                pendingPeerId = targetId;
                setConnectionStatus(`正在尋找房間「${targetId}」…`, 'connecting');
                log(`正在初始化 P2P，準備加入房間：${targetId}`);
                initPeer();
                return;
            }

            if (peer.disconnected) {
                pendingPeerId = targetId;
                try {
                    peer.reconnect();
                    log(`PeerJS 訊號斷線，正在重新連線...`);
                } catch (err) {
                    log(`重新連線失敗：${err.message || err}`);
                }
                return;
            }

            connectToPeerId(targetId);
        }

        function connectToPeerId(targetId) {
            if (!peer || peer.destroyed) {
                pendingPeerId = targetId;
                initPeer();
                return;
            }

            if (peer.disconnected) {
                pendingPeerId = targetId;
                try { peer.reconnect(); } catch (_) {}
                return;
            }

            if (conn) {
                try { conn.close(); } catch (_) {}
                conn = null;
            }

            try {
                setConnectionStatus(`正在建立與「${targetId}」的 WebRTC 連線…`, 'connecting');
                conn = peer.connect(targetId, {
                    label: 'battle-room',
                    serialization: 'json',
                    reliable: true,
                    metadata: {
                        role: 'CPC',
                        version: 1
                    }
                });

                myRole = 'CPC';
                log(`正在加入房間：${targetId} ...`);
                startConnectionTimeout('加入房間');
                setupConnection(conn, false);
            } catch (err) {
                log(`建立 P2P 通道失敗：${err.message || err}`);
            }
        }

        function setupConnection(connection, isHost) {
            if (!connection) return;

            connection._pending = true;

            connection.on('open', () => {
                connection._pending = false;
                clearConnectionTimeout();
                setConnectionStatus(`P2P 通道已建立：已與 ${connection.peer} 連線`, 'success');
                log(`P2P 通道建立成功！`);

                // 只有通道真的 open 後才傳送 INIT。
                if (isHost) {
                    try {
                        connection.send({
                            type: 'INIT',
                            gameState: gameState
                        });
                    } catch (err) {
                        log(`初始化資料傳送失敗：${err.message || err}`);
                    }
                }

                renderMapElements();
                updateActionButtonStates();
            });

            connection.on('data', (data) => {
                if (!data || typeof data !== 'object' || !data.type) return;

                if (data.type === 'INIT') {
                    if (!data.gameState || !Array.isArray(data.gameState.regions)) return;

                    gameState = data.gameState;
                    if (data.specialState) specialState = data.specialState;
                    if (data.hqState) hqState = data.hqState;
                    gameOver = false;
                    log(`已同步戰局資料，你扮演 共軍`);
                } else if (data.type === 'ACTION' || data.type === 'END_TURN' || data.type === 'SKILL' || data.type === 'EVENT_RESULT') {
                    if (!data.gameState || !Array.isArray(data.gameState.regions)) return;

                    gameState = data.gameState;
                    if (data.specialState) specialState = data.specialState;
                    if (data.hqState) hqState = data.hqState;

                    if (data.anim &&
                        Number.isFinite(data.anim.lat) &&
                        Number.isFinite(data.anim.lng)) {
                        showMapFloatingNum(
                            data.anim.lat,
                            data.anim.lng,
                            String(data.anim.text || ''),
                            String(data.anim.color || '#fff')
                        );
                    }

                    if (typeof data.msg === 'string') log(data.msg);
                } else if (data.type === 'EVENT_RESULT') {
                    if (data.specialState) specialState = data.specialState;
                    pendingEvent = false;
                    const banner = document.getElementById('event-banner');
                    if (banner) banner.style.display = 'none';
                    if (typeof data.msg === 'string') log(data.msg);
                } else if (data.type === 'RESET') {
                    alert("對手重置了戰局！");
                    resetGameData();
                }

                renderMapElements();
                updateActionButtonStates();
                checkWin();
            });

            connection.on('close', () => {
                connection._pending = false;
                if (conn === connection) {
                    clearConnectionTimeout();
                    setConnectionStatus('P2P 對戰連線已關閉', 'error');
                    log(`P2P 對戰連線已關閉。`);
                    conn = null;
                }
            });

            connection.on('error', (err) => {
                connection._pending = false;
                clearConnectionTimeout();
                setConnectionStatus(`P2P 通道錯誤：${err.message || '未知錯誤'}`, 'error');
                log(`P2P 通道錯誤：${err.message || '未知錯誤'}`);
            });
        }

        function sendData(data) {
            if (!conn || !conn.open) {
                log(`資料尚未傳送：P2P 通道尚未建立。`);
                return false;
            }

            try {
                conn.send(data);
                return true;
            } catch (err) {
                log(`資料傳送失敗：${err.message || err}`);
                return false;
            }
        }

        function switchGameMode(mode) {
            if (mode === gameMode) return;

            if (mode === 'AI') {
                if (conn) {
                    try { conn.close(); } catch (_) {}
                }
                conn = null;
                pendingPeerId = null;
                clearTimeout(reconnectTimer);
                clearConnectionTimeout();

                if (peer && !peer.destroyed) {
                    try { peer.destroy(); } catch (_) {}
                }
                peer = null;

                gameMode = 'AI';
                myRole = 'KMT';
            } else {
                gameMode = 'P2P';
                myRole = 'KMT';
            }

            document.getElementById('btn-mode-ai').classList.toggle('active', mode === 'AI');
            document.getElementById('btn-mode-p2p').classList.toggle('active', mode === 'P2P');
            document.getElementById('p2p-panel').style.display = mode === 'P2P' ? 'flex' : 'none';

            resetGame(false);
        }

        function resetGame(notify = true) {
            if (gameMode === 'P2P' && notify && conn && conn.open) {
                sendData({ type: 'RESET' });
            }
            resetGameData();
        }

        function resetGameData() {
            isAiThinking = false;
            gameOver = false;
            gameState = { turn: 'KMT', ap: getMaxAP('KMT'), round: 1, regions: JSON.parse(JSON.stringify(initialRegions)) };
            specialState = {
                KMT: { sp: 2, morale: 50, shield: 0, surge: 0 },
                CPC: { sp: 3, morale: 55, shield: 0, surge: 0 }
            };
            pendingEvent = false;
            nextEventHint = null;
            hqState = JSON.parse(JSON.stringify(headquarters));
            const banner = document.getElementById('event-banner');
            if (banner) banner.style.display = 'none';
            selectedRegionId = null;
            renderMapElements();
            updateActionButtonStates();
            log(`戰局已恢復初始狀態`);
            log('【難度規則】共軍 4 區開局、區域耐久較高、每回合 4 AP，並有縱深防禦。');
        }

        function log(msg) {
            const win = document.getElementById('log-window');
            const row = document.createElement('div');
            row.textContent = `> ${String(msg)}`;
            win.appendChild(row);
            win.scrollTop = win.scrollHeight;
        }

        window.onload = () => {
            initMap();

            if (!window.RTCPeerConnection || !window.RTCDataChannel) {
                setConnectionStatus('此瀏覽器不支援 WebRTC DataChannel，P2P 無法使用。', 'error');
            } else if (typeof window.Peer !== 'function') {
                setConnectionStatus('PeerJS 尚未載入，請確認可以連線 cdnjs.cloudflare.com。', 'error');
            } else {
                setConnectionStatus('AI 單人模式就緒；切換到 P2P 後即可建立或加入房間。', 'idle');
            }
        };
    </script>
</body>
