<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大戰局：歷史反攻地圖 - SVG原生版</title>
    <!-- FontAwesome 6 (僅圖示) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MQTT.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>

    <style>
        :root {
            --bg-dark: #070a0e;
            --panel-bg: rgba(13, 19, 28, 0.92);
            --panel-border: rgba(56, 189, 248, 0.25);
            --kmt-color: #38bdf8;
            --cpc-color: #f43f5e;
            --gold-accent: #f59e0b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        header {
            width: 100%; max-width: 1100px; padding: 8px 12px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .title-group h1 { font-size: 1.1rem; color: var(--text-main); }
        .title-group h1 span { color: var(--gold-accent); }

        .main-container {
            display: flex; flex-direction: column; gap: 8px;
            width: 100%; max-width: 1100px; padding: 6px;
        }

        .hud-bar {
            background: var(--panel-bg); border: 1px solid var(--panel-border);
            border-radius: 8px; padding: 6px 10px; display: flex;
            justify-content: space-between; align-items: center; gap: 8px;
        }

        .turn-badge { font-size: 0.8rem; font-weight: bold; padding: 4px 8px; border-radius: 4px; }
        .badge-kmt { background: rgba(56, 189, 248, 0.2); border: 1px solid var(--kmt-color); color: var(--kmt-color); }
        .badge-cpc { background: rgba(244, 63, 94, 0.2); border: 1px solid var(--cpc-color); color: var(--cpc-color); }

        .ap-tracker { display: flex; align-items: center; gap: 4px; }
        .ap-dot { width: 10px; height: 10px; border-radius: 50%; background: #1e293b; border: 1px solid #475569; }
        .ap-dot.active { background: var(--gold-accent); box-shadow: 0 0 6px var(--gold-accent); }

        .end-turn-btn {
            background: #d97706; color: #fff; border: none; padding: 5px 10px;
            border-radius: 6px; font-weight: bold; font-size: 0.75rem; cursor: pointer;
        }
        .end-turn-btn:disabled { background: #334155; color: #64748b; }

        /* SVG 原生地圖容器 */
        #map-container {
            position: relative; width: 100%; height: 45vh; min-height: 280px;
            background: #0b131e; border: 1px solid var(--panel-border);
            border-radius: 8px; overflow: hidden;
        }

        svg#svg-map { width: 100%; height: 100%; }

        .map-node { cursor: pointer; transition: all 0.2s; }
        .map-node:hover { filter: brightness(1.2); }
        .map-node.selected circle { stroke: var(--gold-accent) !important; stroke-width: 3px !important; }

        .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .control-card {
            background: var(--panel-bg); border: 1px solid var(--panel-border);
            border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px;
        }

        .card-header {
            font-size: 0.8rem; font-weight: bold; color: var(--gold-accent);
            display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px;
        }

        .mode-btn {
            background: rgba(255,255,255,0.08); border: 1px solid var(--panel-border);
            color: var(--text-main); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.7rem;
        }
        .mode-btn.active { background: var(--gold-accent); color: #000; font-weight: bold; }

        .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .action-card-btn {
            background: rgba(30, 41, 59, 0.8); border: 1px solid var(--panel-border);
            border-radius: 6px; padding: 6px; color: var(--text-main); cursor: pointer;
            display: flex; flex-direction: column; text-align: left;
        }
        .action-card-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .action-card-btn .btn-title { font-weight: bold; font-size: 0.75rem; display: flex; justify-content: space-between; }
        .action-card-btn .btn-desc { font-size: 0.65rem; color: var(--text-muted); }

        #log-window {
            height: 100px; background: rgba(5, 8, 12, 0.95); border: 1px solid var(--panel-border);
            color: #38edf8; font-family: monospace; padding: 6px; overflow-y: auto;
            border-radius: 4px; font-size: 0.72rem; line-height: 1.35;
        }

        .floating-num {
            position: absolute; font-size: 1.2rem; font-weight: 900; pointer-events: none;
            animation: floatUp 0.8s ease-out forwards; text-shadow: 0 0 6px #000; z-index: 100;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -30px); }
        }

        @media (max-width: 768px) { .bottom-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <div class="title-group">
            <h1><i class="fa-solid fa-satellite-dish"></i> 大戰局：<span>反攻戰術地圖</span></h1>
        </div>
        <div style="display:flex; gap:4px;">
            <button class="mode-btn active" id="btn-mode-ai" onclick="switchGameMode('AI')">AI 單人</button>
            <button class="mode-btn" id="btn-mode-p2p" onclick="switchGameMode('P2P')">雙人連線</button>
        </div>
    </header>

    <div class="main-container">
        <div class="hud-bar">
            <div style="display:flex; align-items:center; gap:10px;">
                <div id="turn-badge" class="turn-badge badge-kmt">國軍階段</div>
                <div class="ap-tracker">
                    <span style="font-size:0.7rem; color:var(--text-muted);">AP</span>
                    <div class="ap-dots" id="ap-dots"></div>
                </div>
            </div>
            <div style="display:flex; gap:4px;">
                <button class="end-turn-btn" id="btn-end-turn" onclick="endTurn()">結束回合</button>
                <button class="mode-btn" style="background:#b91c1c; color:#fff;" onclick="resetGame(true)">重置</button>
            </div>
        </div>

        <!-- 100% 渲染成功的 Native SVG 地圖 -->
        <div id="map-container">
            <svg id="svg-map" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet">
                <!-- 連線背景 -->
                <g id="svg-lines"></g>
                <!-- 地圖節點 -->
                <g id="svg-nodes"></g>
            </svg>
        </div>

        <div class="bottom-grid">
            <div class="control-card">
                <div class="card-header">
                    <span><i class="fa-solid fa-crosshairs"></i> 目標：<b id="target-region-name" style="color:#fff;">請點選地圖節點</b></span>
                    <span id="target-region-hp" style="color:var(--text-muted);">HP: --/--</span>
                </div>
                
                <div class="actions-grid">
                    <button class="action-card-btn" id="act-attack" onclick="executeTacticalAction('ATTACK')" disabled>
                        <div class="btn-title"><span>強襲</span><span style="color:var(--gold-accent)">2 AP</span></div>
                        <div class="btn-desc">傷害 25-45 HP</div>
                    </button>
                    <button class="action-card-btn" id="act-raid" onclick="executeTacticalAction('RAID')" disabled>
                        <div class="btn-title"><span>奇襲</span><span style="color:var(--gold-accent)">1 AP</span></div>
                        <div class="btn-desc">15 傷害 (35% 暴擊)</div>
                    </button>
                    <button class="action-card-btn" id="act-fortify" onclick="executeTacticalAction('FORTIFY')" disabled>
                        <div class="btn-title"><span>加固</span><span style="color:var(--gold-accent)">1 AP</span></div>
                        <div class="btn-desc">修復 +25 HP</div>
                    </button>
                    <button class="action-card-btn" id="act-conscript" onclick="executeTacticalAction('CONSCRIPT')" disabled>
                        <div class="btn-title"><span>徵兵</span><span style="color:var(--gold-accent)">2 AP</span></div>
                        <div class="btn-desc">上限 +20 HP</div>
                    </button>
                </div>

                <div id="p2p-panel" style="display: none; flex-direction: column; gap:4px; border-top:1px solid rgba(255,255,255,0.1); padding-top:4px;">
                    <div style="font-size:0.7rem; color:var(--gold-accent);">扮演：
                        <select id="role-select" onchange="changeRole(this.value)" style="background:#000; color:#fff;">
                            <option value="KMT">國軍 (房主)</option>
                            <option value="CPC">共軍 (挑戰者)</option>
                        </select>
                    </div>
                    <div style="display:flex; gap:4px;">
                        <input type="text" id="room-id" value="room888" style="background:#000; color:#fff; border:1px solid #333; padding:2px; font-size:0.75rem; flex:1;">
                        <button class="mode-btn" id="btn-connect" onclick="joinRoom()">進入房間</button>
                    </div>
                </div>
            </div>

            <div class="control-card">
                <div class="card-header">
                    <span><i class="fa-solid fa-terminal"></i> 戰術動態 Log</span>
                    <span id="round-indicator">ROUND 1</span>
                </div>
                <div id="log-window"></div>
            </div>
        </div>
    </div>

    <script>
        const initialRegions = [
            { id: 'northeast', name: '東北 (瀋陽)', owner: 'CPC', hp: 100, maxHp: 100, x: 620, y: 120 },
            { id: 'north', name: '華北 (北京)', owner: 'CPC', hp: 100, maxHp: 100, x: 500, y: 180 },
            { id: 'east', name: '華東 (南京)', owner: 'CPC', hp: 100, maxHp: 100, x: 540, y: 290 },
            { id: 'south', name: '華南 (廣州)', owner: 'CPC', hp: 100, maxHp: 100, x: 480, y: 400 },
            { id: 'southwest', name: '西南 (成都)', owner: 'CPC', hp: 100, maxHp: 100, x: 300, y: 320 },
            { id: 'taiwan', name: '台灣 (台北)', owner: 'KMT', hp: 100, maxHp: 100, x: 680, y: 380 }
        ];

        let gameMode = 'AI';
        const MAX_AP = 3;
        let gameState = { turn: 'KMT', ap: MAX_AP, round: 1, regions: JSON.parse(JSON.stringify(initialRegions)) };
        let selectedRegionId = null;
        let myRole = 'KMT';
        let mqttClient = null;
        let currentTopic = "";
        let mySenderId = Math.random().toString(36).substring(7);
        let isAiThinking = false;

        function renderMap() {
            const linesGroup = document.getElementById('svg-lines');
            const nodesGroup = document.getElementById('svg-nodes');
            linesGroup.innerHTML = '';
            nodesGroup.innerHTML = '';

            const taiwan = gameState.regions.find(r => r.id === 'taiwan');

            // 繪製連線
            gameState.regions.forEach(r => {
                if (r.id !== 'taiwan') {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', taiwan.x);
                    line.setAttribute('y1', taiwan.y);
                    line.setAttribute('x2', r.x);
                    line.setAttribute('y2', r.y);
                    line.setAttribute('stroke', r.owner === 'KMT' ? '#38bdf8' : '#f43f5e');
                    line.setAttribute('stroke-width', r.id === selectedRegionId ? '2' : '1');
                    line.setAttribute('stroke-dasharray', '4');
                    line.setAttribute('opacity', '0.5');
                    linesGroup.appendChild(line);
                }
            });

            // 繪製地圖節點
            gameState.regions.forEach(r => {
                const isSelected = r.id === selectedRegionId;
                const isKmt = r.owner === 'KMT';

                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.setAttribute('class', `map-node ${isSelected ? 'selected' : ''}`);
                g.onclick = () => selectRegion(r.id);

                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', r.x);
                circle.setAttribute('cy', r.y);
                circle.setAttribute('r', '18');
                circle.setAttribute('fill', isKmt ? '#38bdf8' : '#f43f5e');
                circle.setAttribute('stroke', '#ffffff');
                circle.setAttribute('stroke-width', '2');

                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', r.x);
                text.setAttribute('y', r.y + 32);
                text.setAttribute('fill', '#ffffff');
                text.setAttribute('font-size', '12');
                text.setAttribute('font-weight', 'bold');
                text.setAttribute('text-anchor', 'middle');
                text.textContent = r.name.split(' ')[0];

                g.appendChild(circle);
                g.appendChild(text);
                nodesGroup.appendChild(g);
            });

            updateHUD();
        }

        function selectRegion(id) {
            selectedRegionId = id;
            renderMap();
            updateActionButtonStates();
        }

        function updateHUD() {
            const isMyTurn = gameState.turn === myRole;
            const badge = document.getElementById('turn-badge');
            badge.className = `turn-badge ${gameState.turn === 'KMT' ? 'badge-kmt' : 'badge-cpc'}`;
            badge.innerText = `${gameState.turn === 'KMT' ? '國軍階段' : '共軍階段'} ${isMyTurn ? '(你)' : ''}`;

            document.getElementById('btn-end-turn').disabled = !isMyTurn || isAiThinking;

            const apContainer = document.getElementById('ap-dots');
            apContainer.innerHTML = '';
            for (let i = 0; i < MAX_AP; i++) {
                const dot = document.createElement('div');
                dot.className = `ap-dot ${i < gameState.ap ? 'active' : ''}`;
                apContainer.appendChild(dot);
            }

            document.getElementById('round-indicator').innerText = `ROUND ${gameState.round}`;

            const targetName = document.getElementById('target-region-name');
            const targetHp = document.getElementById('target-region-hp');

            if (selectedRegionId) {
                const region = gameState.regions.find(r => r.id === selectedRegionId);
                targetName.innerText = region.name;
                targetHp.innerText = `HP: ${Math.max(0, region.hp)}/${region.maxHp}`;
            } else {
                targetName.innerText = "請點選地圖節點";
                targetHp.innerText = "HP: --/--";
            }
        }

        function updateActionButtonStates() {
            const isMyTurn = gameState.turn === myRole && !isAiThinking;
            const region = gameState.regions.find(r => r.id === selectedRegionId);

            const btnAttack = document.getElementById('act-attack');
            const btnRaid = document.getElementById('act-raid');
            const btnFortify = document.getElementById('act-fortify');
            const btnConscript = document.getElementById('act-conscript');

            if (!region || !isMyTurn) {
                [btnAttack, btnRaid, btnFortify, btnConscript].forEach(btn => btn.disabled = true);
                return;
            }

            const isEnemy = region.owner !== myRole;
            btnAttack.disabled = !isEnemy || gameState.ap < 2;
            btnRaid.disabled = !isEnemy || gameState.ap < 1;
            btnFortify.disabled = isEnemy || gameState.ap < 1;
            btnConscript.disabled = isEnemy || gameState.ap < 2;
        }

        function executeTacticalAction(type) {
            if (gameState.turn !== myRole || isAiThinking || !selectedRegionId) return;
            const region = gameState.regions.find(r => r.id === selectedRegionId);
            if (!region) return;

            let logMsg = "", animText = "", animColor = "#f43f5e", apCost = 0;

            if (type === 'ATTACK') {
                apCost = 2; const dmg = Math.floor(Math.random() * 21) + 25;
                region.hp -= dmg; animText = `-${dmg}`;
                logMsg = `${myRole === 'KMT' ? '國軍' : '共軍'} 強襲 [${region.name}] -${dmg} HP`;
            } else if (type === 'RAID') {
                apCost = 1; const isCrit = Math.random() < 0.35; const dmg = isCrit ? 50 : 15;
                region.hp -= dmg; animText = `-${dmg}`; animColor = "#a855f7";
                logMsg = `${myRole === 'KMT' ? '國軍' : '共軍'} 奇襲 [${region.name}] -${dmg} HP`;
            } else if (type === 'FORTIFY') {
                apCost = 1; region.hp = Math.min(region.maxHp, region.hp + 25);
                animText = `+25`; animColor = "#22c55e";
                logMsg = `${myRole === 'KMT' ? '國軍' : '共軍'} 加固 [${region.name}] +25 HP`;
            } else if (type === 'CONSCRIPT') {
                apCost = 2; region.maxHp += 20; region.hp += 20;
                animText = `上限+20`; animColor = "#38bdf8";
                logMsg = `${myRole === 'KMT' ? '國軍' : '共軍'} [${region.name}] 徵兵`;
            }

            gameState.ap -= apCost;
            if (region.hp <= 0) { region.hp = 50; region.owner = myRole; logMsg += ` (攻佔該區！)`; }

            showMapFloatingNum(region.x, region.y, animText, animColor);
            log(logMsg);
            renderMap();
            updateActionButtonStates();

            if (gameMode === 'P2P') {
                sendMqttData({ type: 'ACTION', gameState: gameState, msg: logMsg, anim: { x: region.x, y: region.y, text: animText, color: animColor } });
            }

            checkWin();
        }

        function endTurn() {
            if (gameState.turn !== myRole || isAiThinking) return;
            gameState.turn = gameState.turn === 'KMT' ? 'CPC' : 'KMT';
            gameState.ap = MAX_AP;
            gameState.round += 1;

            log(`--- 切換至 [${gameState.turn === 'KMT' ? '國軍' : '共軍'}] 階段 ---`);
            renderMap();
            updateActionButtonStates();

            if (gameMode === 'P2P') sendMqttData({ type: 'END_TURN', gameState: gameState, msg: '對手已結束回合' });
            if (gameMode === 'AI' && gameState.turn === 'CPC') aiTurnEngine();
        }

        function aiTurnEngine() {
            isAiThinking = true;
            updateHUD(); updateActionButtonStates();
            let aiAp = MAX_AP;

            const aiInterval = setInterval(() => {
                const kmtRegions = gameState.regions.filter(r => r.owner === 'KMT');
                if (aiAp >= 2 && kmtRegions.length > 0) {
                    kmtRegions.sort((a, b) => a.hp - b.hp);
                    const target = kmtRegions[0];
                    target.hp -= 30; aiAp -= 2;
                    showMapFloatingNum(target.x, target.y, `-30`, "#f43f5e");
                    let msg = `電腦 AI 強襲 [${target.name}] (-30)`;
                    if (target.hp <= 0) { target.hp = 50; target.owner = 'CPC'; msg += ` (已被佔領)`; }
                    log(msg);
                } else { aiAp = 0; }

                renderMap();
                if (aiAp <= 0 || checkWin()) {
