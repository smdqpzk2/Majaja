<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大戰局：歷史反攻地圖 - 修復版</title>
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS & JS (換用可靠 CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- MQTT.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>

    <style>
        :root {
            --bg-dark: #070a0e;
            --panel-bg: rgba(13, 19, 28, 0.92);
            --panel-border: rgba(56, 189, 248, 0.25);
            --kmt-color: #38bdf8;
            --kmt-glow: rgba(56, 189, 248, 0.4);
            --cpc-color: #f43f5e;
            --cpc-glow: rgba(244, 63, 94, 0.4);
            --gold-accent: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.5);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        header {
            width: 100%; max-width: 1100px; padding: 10px 15px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .title-group h1 {
            font-size: 1.2rem; color: var(--text-main);
            display: flex; align-items: center; gap: 8px;
        }
        .title-group h1 span { color: var(--gold-accent); }
        .subtitle { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }

        .main-container {
            display: flex; flex-direction: column; gap: 8px;
            width: 100%; max-width: 1100px; padding: 6px;
        }

        .hud-bar {
            background: var(--panel-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border); border-radius: 8px;
            padding: 8px 12px; display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 8px;
        }

        .hud-status { display: flex; align-items: center; gap: 12px; }
        .turn-badge {
            font-size: 0.8rem; font-weight: bold; padding: 4px 8px; border-radius: 4px;
            display: flex; align-items: center; gap: 6px;
        }
        .badge-kmt { background: rgba(56, 189, 248, 0.15); border: 1px solid var(--kmt-color); color: var(--kmt-color); }
        .badge-cpc { background: rgba(244, 63, 94, 0.15); border: 1px solid var(--cpc-color); color: var(--cpc-color); }

        .ap-tracker { display: flex; align-items: center; gap: 6px; }
        .ap-title { font-size: 0.75rem; color: var(--text-muted); font-weight: bold; }
        .ap-dots { display: flex; gap: 4px; }
        .ap-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #1e293b; border: 1px solid #475569; transition: all 0.3s;
        }
        .ap-dot.active { background: var(--gold-accent); border-color: #fff; box-shadow: 0 0 6px var(--gold-glow); }

        .end-turn-btn {
            background: linear-gradient(135deg, #d97706, #b45309);
            color: #fff; border: none; padding: 6px 14px; border-radius: 6px;
            font-weight: bold; font-size: 0.8rem; cursor: pointer;
        }
        .end-turn-btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

        /* 地圖區域修正 */
        #map-container { 
            position: relative; width: 100%; border-radius: 8px; 
            overflow: hidden; border: 1px solid var(--panel-border); 
            height: 48vh; min-height: 300px; background: #0b111a;
        }
        #map { 
            height: 100%; width: 100%; background: #0d131c; 
        }

        .tactical-marker {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #fff; font-size: 13px;
            border: 2px solid #fff; transition: all 0.2s; cursor: pointer;
        }
        .marker-kmt { background: var(--kmt-color); box-shadow: 0 0 10px var(--kmt-color); }
        .marker-cpc { background: var(--cpc-color); box-shadow: 0 0 10px var(--cpc-color); }
        .marker-selected { transform: scale(1.3); border-color: var(--gold-accent) !important; box-shadow: 0 0 15px var(--gold-accent) !important; z-index: 1000 !important; }

        .bottom-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
        }

        .control-card {
            background: var(--panel-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border); border-radius: 8px; padding: 10px;
            display: flex; flex-direction: column; gap: 8px;
        }

        .card-header {
            font-size: 0.85rem; font-weight: bold; color: var(--gold-accent);
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px;
        }

        .mode-selector { display: flex; gap: 6px; }
        .mode-btn {
            background: rgba(255,255,255,0.08); border: 1px solid var(--panel-border);
            color: var(--text-main); padding: 5px 10px; border-radius: 4px;
            cursor: pointer; font-size: 0.75rem;
        }
        .mode-btn.active { background: var(--gold-accent); color: #000; font-weight: bold; }

        .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .action-card-btn {
            background: rgba(30, 41, 59, 0.8); border: 1px solid var(--panel-border);
            border-radius: 6px; padding: 8px; color: var(--text-main); cursor: pointer;
            display: flex; flex-direction: column; gap: 2px; text-align: left;
        }
        .action-card-btn:disabled { opacity: 0.35; cursor: not-allowed; border-color: transparent; }
        .action-card-btn .btn-title { font-weight: bold; font-size: 0.8rem; display: flex; justify-content: space-between; }
        .action-card-btn .btn-cost { font-size: 0.7rem; color: var(--gold-accent); }
        .action-card-btn .btn-desc { font-size: 0.65rem; color: var(--text-muted); }

        #log-window {
            height: 110px; background: rgba(5, 8, 12, 0.95);
            border: 1px solid var(--panel-border); color: #38edf8;
            font-family: monospace; padding: 6px; overflow-y: auto;
            border-radius: 4px; font-size: 0.75rem; line-height: 1.4;
        }

        .floating-num {
            position: absolute; font-size: 1.3rem; font-weight: 900; pointer-events: none;
            animation: floatUp 0.8s ease-out forwards; text-shadow: 0 0 6px rgba(0,0,0,0.9); z-index: 2000;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
            100% { opacity: 0; transform: translate(-50%, -40px) scale(1); }
        }

        @media (max-width: 768px) {
            .bottom-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="title-group">
            <h1><i class="fa-solid fa-satellite-dish"></i> 大戰局：<span>反攻戰術地圖</span></h1>
            <div class="subtitle">全面修復版</div>
        </div>
        <div class="mode-selector">
            <button class="mode-btn active" id="btn-mode-ai" onclick="switchGameMode('AI')"><i class="fa-solid fa-robot"></i> AI 單人</button>
            <button class="mode-btn" id="btn-mode-p2p" onclick="switchGameMode('P2P')"><i class="fa-solid fa-network-wired"></i> 雙人連線</button>
        </div>
    </header>

    <div class="main-container">
        <div class="hud-bar">
            <div class="hud-status">
                <div id="turn-badge" class="turn-badge badge-kmt">
                    <i class="fa-solid fa-shield-halved"></i> 國軍階段
                </div>
                <div class="ap-tracker">
                    <span class="ap-title">AP</span>
                    <div class="ap-dots" id="ap-dots">
                        <div class="ap-dot active"></div>
                        <div class="ap-dot active"></div>
                        <div class="ap-dot active"></div>
                    </div>
                </div>
            </div>
            <div style="display:flex; gap:6px;">
                <button class="end-turn-btn" id="btn-end-turn" onclick="endTurn()"><i class="fa-solid fa-forward"></i> 結束回合</button>
                <button class="mode-btn" style="background:#b91c1c; color:#fff;" onclick="resetGame(true)"><i class="fa-solid fa-rotate-right"></i> 重置</button>
            </div>
        </div>

        <div id="map-container">
            <div id="map"></div>
        </div>

        <div class="bottom-grid">
            <div class="control-card">
                <div class="card-header">
                    <span><i class="fa-solid fa-crosshairs"></i> 目標：<b id="target-region-name" style="color:#fff;">點擊地圖選擇目標</b></span>
                    <span id="target-region-hp" style="color:var(--text-muted);">HP: --/--</span>
                </div>
                
                <div class="actions-grid">
                    <button class="action-card-btn" id="act-attack" onclick="executeTacticalAction('ATTACK')" disabled>
                        <div class="btn-title"><span><i class="fa-solid fa-burst"></i> 強襲</span><span class="btn-cost">2 AP</span></div>
                        <div class="btn-desc">造成 25-45 點傷害</div>
                    </button>

                    <button class="action-card-btn" id="act-raid" onclick="executeTacticalAction('RAID')" disabled>
                        <div class="btn-title"><span><i class="fa-solid fa-skull"></i> 奇襲</span><span class="btn-cost">1 AP</span></div>
                        <div class="btn-desc">15 傷害 (35% 暴擊 50)</div>
                    </button>

                    <button class="action-card-btn" id="act-fortify" onclick="executeTacticalAction('FORTIFY')" disabled>
                        <div class="btn-title"><span><i class="fa-solid fa-shield"></i> 加固</span><span class="btn-cost">1 AP</span></div>
                        <div class="btn-desc">修復駐軍防線 +25 HP</div>
                    </button>

                    <button class="action-card-btn" id="act-conscript" onclick="executeTacticalAction('CONSCRIPT')" disabled>
                        <div class="btn-title"><span><i class="fa-solid fa-user-plus"></i> 徵兵</span><span class="btn-cost">2 AP</span></div>
                        <div class="btn-desc">提升區域上限 (+20)</div>
                    </button>
                </div>

                <div id="p2p-panel" style="display: none; flex-direction: column; gap:4px; border-top:1px solid rgba(255,255,255,0.1); padding-top:6px;">
                    <div style="font-size:0.75rem; color:var(--gold-accent);">陣營：
                        <select id="role-select" onchange="changeRole(this.value)" style="background:#000; color:#fff; border:1px solid var(--panel-border); font-size:0.75rem; padding:2px;">
                            <option value="KMT">國軍 (房主)</option>
                            <option value="CPC">共軍 (挑戰者)</option>
                        </select>
                    </div>
                    <div style="display:flex; gap:4px;">
                        <input type="text" id="room-id" value="room888" placeholder="輸入相同房號" style="background:#000; border:1px solid var(--panel-border); color:#fff; padding:4px; font-size:0.75rem; border-radius:4px; flex:1;">
                        <button class="mode-btn" id="btn-connect" style="background:var(--gold-accent); color:#000; font-weight:bold;" onclick="joinRoom()">進入房間</button>
                    </div>
                </div>
            </div>

            <div class="control-card">
                <div class="card-header">
                    <span><i class="fa-solid fa-terminal"></i> 戰報 Log</span>
                    <span style="font-size: 0.75rem; color: var(--text-muted);" id="round-indicator">ROUND 1</span>
                </div>
                <div id="log-window"></div>
            </div>
        </div>
    </div>

    <script>
        const initialRegions = [
            { id: 'northeast', name: '東北 (瀋陽)', owner: 'CPC', hp: 100, maxHp: 100, lat: 41.83, lng: 123.43 },
            { id: 'north', name: '華北 (北京)', owner: 'CPC', hp: 100, maxHp: 100, lat: 39.90, lng: 116.40 },
            { id: 'east', name: '華東 (南京)', owner: 'CPC', hp: 100, maxHp: 100, lat: 32.06, lng: 118.79 },
            { id: 'south', name: '華南 (廣州)', owner: 'CPC', hp: 100, maxHp: 100, lat: 23.12, lng: 113.26 },
            { id: 'southwest', name: '大西南 (成都)', owner: 'CPC', hp: 100, maxHp: 100, lat: 30.57, lng: 104.06 },
            { id: 'taiwan', name: '台灣 (台北基地)', owner: 'KMT', hp: 100, maxHp: 100, lat: 25.03, lng: 121.56 }
        ];

        let map = null;
        let markers = {};
        let polylineGroup = null;
        let gameMode = 'AI';
        const MAX_AP = 3;
        let gameState = { turn: 'KMT', ap: MAX_AP, round: 1, regions: JSON.parse(JSON.stringify(initialRegions)) };
        let selectedRegionId = null;
        let myRole = 'KMT';
        let mqttClient = null;
        let currentTopic = "";
        let mySenderId = Math.random().toString(36).substring(7);
        let isAiThinking = false;

        function initMap() {
            if (map !== null) return;

            try {
                // 初始化 Leaflet 地圖
                map = L.map('map', {
                    center: [32.0, 114.0],
                    zoom: 4,
                    zoomControl: false,
                    dragging: false,
                    touchZoom: false,
                    scrollWheelZoom: false,
                    doubleClickZoom: false,
                    boxZoom: false,
                    keyboard: false
                });

                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; OpenStreetMap'
                }).addTo(map);

                polylineGroup = L.layerGroup().addTo(map);

                // 防禦性地圖重新計算，確保畫面無漏洞
                setTimeout(() => {
                    map.invalidateSize();
                    renderMapElements();
                    log("地圖與遊戲系統已就緒，請點選地圖上的圖標展開行動。");
                }, 300);

            } catch (e) {
                console.error("地圖載入失敗:", e);
                log("地圖庫加載異常，請重新整理頁面。");
            }
        }

        function selectRegion(id) {
            selectedRegionId = id;
            renderMapElements();
            updateActionButtonStates();
        }

        function renderMapElements() {
            if (!map) return;
            polylineGroup.clearLayers();

            const taiwanRegion = gameState.regions.find(r => r.id === 'taiwan');

            gameState.regions.forEach(region => {
                const isKmt = region.owner === 'KMT';
                const isSelected = region.id === selectedRegionId;

                const iconHtml = `<div class="tactical-marker ${isKmt ? 'marker-kmt' : 'marker-cpc'} ${isSelected ? 'marker-selected' : ''}">
                                    <i class="fa-solid ${isKmt ? 'fa-shield-halved' : 'fa-flag'}"></i>
                                  </div>`;

                const customIcon = L.divIcon({
                    className: 'custom-map-icon',
                    html: iconHtml,
                    iconSize: [32, 32],
                    iconAnchor: [16, 16]
                });

                if (!markers[region.id]) {
                    const marker = L.marker([region.lat, region.lng], { icon: customIcon }).addTo(map);
                    marker.on('click', () => selectRegion(region.id));
                    markers[region.id] = marker;
                } else {
                    markers[region.id].setIcon(customIcon);
                }

                if (region.id !== 'taiwan' && taiwanRegion) {
                    const line = L.polyline([[taiwanRegion.lat, taiwanRegion.lng], [region.lat, region.lng]], {
                        color: isKmt ? '#38bdf8' : '#f43f5e', weight: isSelected ? 2 : 1, opacity: 0.4, dashArray: '4, 4'
                    });
                    polylineGroup.addLayer(line);
                }
            });

            updateHUD();
        }

        function updateHUD() {
            const isMyTurn = gameState.turn === myRole;
            const badge = document.getElementById('turn-badge');
            const endBtn = document.getElementById('btn-end-turn');

            if (gameState.turn === 'KMT') {
                badge.className = "turn-badge badge-kmt";
                badge.innerHTML = `<i class="fa-solid fa-shield-halved"></i> 國軍階段 ${isMyTurn ? '(你)' : ''}`;
            } else {
                badge.className = "turn-badge badge-cpc";
                badge.innerHTML = `<i class="fa-solid fa-flag"></i> 共軍階段 ${gameMode === 'AI' ? '(電腦)' : (isMyTurn ? '(你)' : '')}`;
            }

            endBtn.disabled = !isMyTurn || isAiThinking;

            const apContainer = document.getElementById('ap-dots');
            apContainer.innerHTML = '';
            for (let i = 0; i < MAX_AP; i++) {
                const dot = document.createElement('div');
                dot.className = `ap-dot ${i < gameState.ap ? 'active' : ''}`;
                apContainer.appendChild(dot);
            }

            document.getElementById('round-indicator').innerText = `ROUND ${gameState.round}`;

            const targetName = document.getElementById('target-region-name');
            const targetHp = document.getElementById('target-region-hp');

            if (selectedRegionId) {
                const region = gameState.regions.find(r => r.id === selectedRegionId);
                targetName.innerText = `${region.name}`;
                targetHp.innerText = `HP: ${Math.max(0, region.hp)}/${region.maxHp}`;
            } else {
                targetName.innerText = "點擊地圖選擇目標";
                targetHp.innerText = "HP: --/--";
            }
        }

        function updateActionButtonStates() {
            const isMyTurn = gameState.turn === myRole && !isAiThinking;
            const region = gameState.regions.find(r => r.id === selectedRegionId);

            const btnAttack = document.getElementById('act-attack');
            const btnRaid = document.getElementById('act-raid');
            const btnFortify = document.getElementById('act-fortify');
            const btnConscript = document.getElementById('act-conscript');

            if (!region || !isMyTurn) {
                [btnAttack, btnRaid, btnFortify, btnConscript].forEach(btn => btn.disabled = true);
                return;
            }

            const isEnemy = region.owner !== myRole;
            btnAttack.disabled = !isEnemy || gameState.ap < 2;
            btnRaid.disabled = !isEnemy || gameState.ap < 1;
            btnFortify.disabled = isEnemy || gameState.ap < 1;
            btnConscript.disabled = isEnemy || gameState.ap < 2;
        }

        function executeTacticalAction(type) {
            if (gameState.turn !== myRole || isAiThinking || !selectedRegionId) return;

            const region = gameState.regions.find(r => r.id === selectedRegionId);
            if (!region) return;

            let logMsg = ``, animText = "", animColor = "#f43f5e", apCost = 0;

            if (type === 'ATTACK') {
                apCost = 2;
                const damage = Math.floor(Math.random() * 21) + 25;
                r="endTurn()"><i class="fa-solid fa-forward"></i> 結束回合</button>
                <button class="mode-btn" style="background:#b91c1c; color:#fff;" onclick="resetGame(true)"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
        </div>

        <div id="map-container">
            <div id="map"></div>
        </div>

        <div class="bottom-grid">
            <div class="control-card">
                <div class="card-header">
                    <span><i class="fa-solid fa-crosshairs"></i> 目標：<b id="target-region-name" style="color:#fff;">請點選地圖區域</b></span>
                    <span id="target-region-hp" style="color:var(--text-muted);">HP: --/--</span>
                </div>
                
                <div class="actions-grid">
                    <button class="action-card-btn" id="act-attack" onclick="executeTacticalAction('ATTACK')" disabled>
                        <div class="btn-title"><span><i class="fa-solid fa-burst"></i> 強襲</span><span class="btn-cost">2 AP</span></div>
                        <div class="btn-desc">造成 25-45 點傷害</div>
                    </button>

                    <button class="action-card-btn" id="act-raid" onclick="executeTacticalAction('RAID')" disabled>
                        <div class="btn-title"><span><i class="fa-solid fa-skull"></i> 奇襲</span><span class="btn-cost">1 AP</span></div>
                        <div class="btn-desc">15 傷害 (35% 機率暴擊 50)</div>
                    </button>

                    <button class="action-card-btn" id="act-fortify" onclick="executeTacticalAction('FORTIFY')" disabled>
                        <div class="btn-title"><span><i class="fa-solid fa-shield"></i> 加固</span><span class="btn-cost">1 AP</span></div>
                        <div class="btn-desc">修復駐軍防線 +25 HP</div>
                    </button>

                    <button class="action-card-btn" id="act-conscript" onclick="executeTacticalAction('CONSCRIPT')" disabled>
                        <div class="btn-title"><span><i class="fa-solid fa-user-plus"></i> 徵兵</span><span class="btn-cost">2 AP</span></div>
                        <div class="btn-desc">提升區域上限 (+20)</div>
                    </button>
                </div>

                <!-- 簡化後的連線面板 -->
                <div id="p2p-panel" style="display: none; flex-direction: column; gap:4px; border-top:1px solid rgba(255,255,255,0.1); padding-top:6px;">
                    <div style="font-size:0.7rem; color:var(--gold-accent);">陣營：
                        <select id="role-select" onchange="changeRole(this.value)" style="background:#000; color:#fff; border:1px solid var(--panel-border); font-size:0.7rem;">
                            <option value="KMT">國軍 (房主)</option>
                            <option value="CPC">共軍 (挑戰者)</option>
                        </select>
                    </div>
                    <div style="display:flex; gap:4px;">
                        <input type="text" id="room-id" value="room888" placeholder="輸入相同房號" style="background:#000; border:1px solid var(--panel-border); color:#fff; padding:4px; font-size:0.75rem; border-radius:4px; flex:1;">
                        <button class="mode-btn" id="btn-connect" style="background:var(--gold-accent); color:#000; font-weight:bold;" onclick="joinRoom()">進入房間</button>
                    </div>
                </div>
            </div>

            <div class="control-card">
                <div class="card-header">
                    <span><i class="fa-solid fa-terminal"></i> 戰術動態 Log</span>
                    <span style="font-size: 0.7rem; color: var(--text-muted);" id="round-indicator">ROUND 1</span>
                </div>
                <div id="log-window"></div>
            </div>
        </div>
    </div>

    <script>
        const initialRegions = [
            { id: 'northeast', name: '東北 (瀋陽)', owner: 'CPC', hp: 100, maxHp: 100, lat: 41.83, lng: 123.43 },

                        className: 'custom-map-icon',

                        iconSize: [30, 30], iconAnchor: [15, 15]
                    });

                    markers[region.id] = marker;
